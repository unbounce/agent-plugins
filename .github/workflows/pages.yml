# Deploy docs/ to GitHub Pages.
#
# docs/ holds one folder per plugin (e.g. docs/unbounce-mcp/ — the tool
# reference), each mirrored in by that plugin's source repo alongside its
# plugins/<name>/ subtree, plus the hand-maintained root index.html. Every
# page is self-contained static HTML, so there is no build step: the artifact
# is the docs/ folder as-is.
name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish so a rapid pair of
# publishes can't leave the site on the older of the two.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
