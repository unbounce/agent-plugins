<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unbounce MCP — Tool Reference</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #1b1f24;
    --muted: #5b6470;
    --line: #e3e6ea;
    --line-strong: #cdd2d9;
    --accent: #2b6cb0;
    --code-bg: #f1f3f5;
    --read: #2b8a5b;
    --read-bg: #e6f4ec;
    --write: #b7791f;
    --write-bg: #fbf0d9;
    --destructive: #c0392b;
    --destructive-bg: #fbe6e3;
    --req: #c0392b;
    --radius: 8px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    font-size: 15px;
  }
  a { color: var(--accent); }
  header.top {
    background: linear-gradient(135deg, #1a2533, #243447);
    color: #fff;
    padding: 28px 0 24px;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  header.top h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.01em; }
  header.top .sub { color: #b6c2d1; font-size: 14px; }
  header.top .sub code { font-family: var(--mono); font-size: 12.5px; color: #9fd0ff; background: none; padding: 0; }

  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .toolbar .wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #search {
    flex: 1 1 280px;
    padding: 9px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: var(--sans);
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .group-by { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .group-by select {
    border: 1px solid var(--line-strong);
    background: var(--panel);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-size: 13px;
    font-family: var(--sans);
    color: var(--ink);
    cursor: pointer;
  }
  .ctrl-btn {
    border: 1px solid var(--line-strong);
    background: var(--panel);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--sans);
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Filter chip groups (one per filterable, non-grouping dimension). */
  .filters { padding: 14px 0 0; }
  .filter-dim { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  .filter-dim .dim-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); font-weight: 700; min-width: 84px; flex: none;
  }
  .filter-dim .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    border: 1px solid var(--line-strong);
    background: var(--panel);
    border-radius: 20px;
    padding: 4px 11px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--sans);
    user-select: none;
  }
  .filter-chip.active { background: #eef2f7; color: var(--ink); border-color: var(--line-strong); }
  /* Kind filter chips carry the kind's own color when active. */
  .filter-chip.active[data-value="read"] { background: var(--read-bg); color: var(--read); border-color: var(--read); }
  .filter-chip.active[data-value="write"] { background: var(--write-bg); color: var(--write); border-color: var(--write); }
  .filter-chip.active[data-value="destructive"] { background: var(--destructive-bg); color: var(--destructive); border-color: var(--destructive); }

  main { padding: 20px 0 80px; }
  .group { margin-bottom: 14px; }
  .group > h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 22px 0 8px; font-weight: 700;
  }
  .group > h3 .grp-count { color: var(--line-strong); font-weight: 600; }

  .tool {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line-strong);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .tool[data-kind="read"] { border-left-color: var(--read); }
  .tool[data-kind="write"] { border-left-color: var(--write); }
  .tool[data-kind="destructive"] { border-left-color: var(--destructive); }

  .tool-head {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; cursor: pointer; user-select: none;
  }
  .tool-head:hover { background: #fafbfc; }
  .chip {
    flex: none;
    font-family: var(--sans); font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 5px; min-width: 84px; text-align: center;
  }
  .chip.read { background: var(--read-bg); color: var(--read); }
  .chip.write { background: var(--write-bg); color: var(--write); }
  .chip.destructive { background: var(--destructive-bg); color: var(--destructive); }

  /* Experimental badge — flags an incubating tool that may change or go away. */
  .chip.experimental {
    flex: none; min-width: 0; text-transform: uppercase; letter-spacing: 0.04em;
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 5px;
    background: #fff4e5; color: #b7791f; border: 1px solid #f0d8a8;
  }

  /* Surface tag — secondary to the kind chip: outlined, monospace. */
  .chip.surface {
    flex: none; min-width: 0; text-transform: none; letter-spacing: 0;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 5px;
    background: #eef0fb; color: #43499a; border: 1px solid #d6d9f3;
  }

  
  .tool-name { font-family: var(--mono); font-size: 14px; font-weight: 600; flex: none; }
  .tool-summary { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .caret { flex: none; color: var(--line-strong); transition: transform 0.15s; font-size: 12px; }
  .tool.open .caret { transform: rotate(90deg); }

  .tool-body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--line); }
  .tool.open .tool-body { display: block; }
  .tool-title { font-size: 13px; color: var(--ink); font-weight: 600; margin: 12px 0 2px; }
  .tool-desc { font-size: 13.5px; color: #333; white-space: pre-wrap; margin: 8px 0 0; }

  .params-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin: 18px 0 6px; }
  .returns-label { color: var(--read); }
  .returns-desc { font-size: 13px; color: #333; margin: 0 0 6px; }
  .returns-note { font-size: 12px; color: var(--muted); font-style: italic; margin: 6px 0 0; }
  table.params { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.params th, table.params td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.params th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: #fafbfc; }
  table.params td.pname { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
  table.params td.ptype code, .inline-code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .req-badge { font-size: 10px; font-weight: 700; color: var(--req); text-transform: uppercase; letter-spacing: 0.03em; }
  .opt-badge { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .pdesc { color: #333; }
  .pmeta { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .pmeta code { font-family: var(--mono); background: var(--code-bg); padding: 0 4px; border-radius: 3px; }
  .no-params { color: var(--muted); font-size: 13px; font-style: italic; margin: 10px 0 0; }
  .no-results { text-align: center; color: var(--muted); padding: 40px; display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0 50px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Unbounce MCP — Tool Reference</h1>
    <div class="sub">Tools exposed by the <code>unbounce-mcp</code> server.</div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <input id="search" type="search" placeholder="Filter tools by name or description…" autocomplete="off" />
    <label class="group-by">Group by
      <select id="groupBy"></select>
    </label>
    <button class="ctrl-btn" id="expandAll">Expand all</button>
    <button class="ctrl-btn" id="collapseAll">Collapse all</button>
    <div class="filters wrap" id="filters" style="padding-left:0;padding-right:0;flex-basis:100%"></div>
  </div>
</div>

<main class="wrap">
  <div id="content"></div>
  <div class="no-results" id="noResults">No tools match your filter.</div>
</main>

<footer id="footer"></footer>

<script>
const DATA = {"generatedAt":"2026-08-06T00:41:23.172Z","internal":false,"defaultGroupBy":"topics","toolCount":38,"dimensions":[{"key":"topics","label":"Topic","multi":true,"groupable":true,"filterable":true,"isKind":false,"values":["Identity & Accounts","Pages","Variants","Publishing & Traffic","Domains","Page Groups","Stats","Assets","Workspace Files","Server"]},{"key":"kind","label":"Kind","multi":false,"groupable":true,"filterable":true,"isKind":true,"values":["read","write","destructive"]},{"key":"surface","label":"Surface","multi":false,"groupable":true,"filterable":true,"isKind":false,"values":["api"]}],"tools":[{"name":"upload","title":"Upload files","summary":"Upload local files (html/css/js + assets) to your server-side workspace WITHOUT sending their bytes through this conversation.","description":"Upload local files (html/css/js + assets) to your server-side workspace WITHOUT sending their bytes through this conversation. Returns one presigned PUT URL per file; run the printed `curl -T \u003clocalfile> '\u003cupload_url>'` for each (no auth header needed — auth is in the URL). The bytes go straight to storage, never through the model. Then pass the returned `upload_path` values (`upload://\u003chandle>/\u003crelpath>`) to other tools — as the html_ref for the HTML-authoring tools, or as an image/font reference inside authored HTML and bulk_edit_variants op values (rehosted to a client-owned CDN URL when applied). Declare each file's exact byte size (`wc -c \u003cfile>`); the size is enforced on upload.","params":[{"name":"files","type":"array\u003cobject>","required":true,"allowed":null,"description":"The files to upload (1–50). Relative paths share one upload folder."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"download","title":"Download files","summary":"Download objects from your server-side workspace WITHOUT routing their bytes through this conversation.","description":"Download objects from your server-side workspace WITHOUT routing their bytes through this conversation. Pass the `upload://\u003chandle>/\u003crelpath>` references returned by `upload`. Returns one presigned GET URL per reference; run the printed `curl -o \u003clocalfile> '\u003cdownload_url>'` for each (no auth header needed — auth is in the URL). The bytes stream straight from storage to disk, never through the model.","params":[{"name":"refs","type":"array\u003cstring>","required":true,"allowed":null,"description":"The `upload://\u003chandle>/\u003crelpath>` references to fetch (1–50), as returned by `upload`."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"upload_inband","title":"Upload files (inline content)","summary":"Upload text files (HTML/CSS/JS) to your server-side workspace by sending each file's content INLINE as a tool argument.","description":"Upload text files (HTML/CSS/JS) to your server-side workspace by sending each file's content INLINE as a tool argument. Use this ONLY if you cannot run shell/`curl` commands locally; if you can, prefer `upload`, which keeps the bytes out of this conversation. The content rides through the conversation, so keep files small and text-only — binary assets (images, fonts) are NOT supported here: reference them by external http(s) URL instead (create_page_from_html / create_variant_from_html rehost or pass through external URLs, and you can reuse an existing asset's cdn_url from list_assets). Returns one `upload://\u003chandle>/\u003crelpath>` reference per file; pass those to create_page_from_html / create_variant_from_html / update_variant_from_html exactly as you would the references from `upload` (relative paths share one upload folder, so a file can reference a sibling by relative path).","params":[{"name":"files","type":"array\u003cobject>","required":true,"allowed":null,"description":"The files to upload (1–50). Relative paths share one upload folder."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"download_inband","title":"Download files (inline content)","summary":"Read objects from your server-side workspace by returning their content INLINE in this tool's result.","description":"Read objects from your server-side workspace by returning their content INLINE in this tool's result. Use this ONLY if you cannot run shell/`curl` commands locally; if you can, prefer `download`, which streams the bytes to disk without passing them through this conversation. Pass the `upload://\u003chandle>/\u003crelpath>` references returned by `upload`, `upload_inband`, or `get_variant`. Only small text objects can be returned this way — a binary object (image/font) or one over 2 MiB is refused, with guidance to use `download` instead; any refused reference fails the call, so retry with the others. The content rides through the conversation, so expect only small text files.","params":[{"name":"refs","type":"array\u003cstring>","required":true,"allowed":null,"description":"The `upload://\u003chandle>/\u003crelpath>` references to read (1–50), as returned by `upload`, `upload_inband`, or `get_variant`."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"whoami","title":"Who am I","summary":"Return the authenticated Unbounce user (sub, id, email, first_name, last_name) by calling the Unbounce API with the caller's upstream Doorkeeper token.","description":"Return the authenticated Unbounce user (sub, id, email, first_name, last_name) by calling the Unbounce API with the caller's upstream Doorkeeper token.","params":[],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Identity & Accounts"],"surface":"api","experimental":false}},{"name":"list_accounts_and_clients","title":"List accounts and clients","summary":"Return the Unbounce accounts the authenticated user can access, each with its clients, by calling the Unbounce GraphQL API (currentAccessibleAccounts) with the caller's upstream Doorkeeper token.","description":"Return the Unbounce accounts the authenticated user can access, each with its clients, by calling the Unbounce GraphQL API (currentAccessibleAccounts) with the caller's upstream Doorkeeper token.","params":[],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Identity & Accounts"],"surface":"api","experimental":false}},{"name":"get_account_plan","title":"Get an account's plan","summary":"Return an Unbounce account's plan (name, billing interval) and subscription (renewal date, price with currency).","description":"Return an Unbounce account's plan (name, billing interval) and subscription (renewal date, price with currency). Defaults to the authenticated user's primary account; pass accountUuid (from list_accounts_and_clients) to target a specific accessible account. `plan` and `subscription` are null when your role cannot see billing details — they are visible only to an Account Owner or Account Administrator, and null for Authors and Viewers (a normal result, not an error).","params":[{"name":"accountUuid","type":"string","required":false,"allowed":null,"description":"The accountUuid (from list_accounts_and_clients) to look up. Omit to use your primary account."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Identity & Accounts"],"surface":"api","experimental":false}},{"name":"list_client_pages","title":"List a client's pages","summary":"Return a client's landing pages (by clientUuid from list_accounts_and_clients), with optional server-side filters and sort.","description":"Return a client's landing pages (by clientUuid from list_accounts_and_clients), with optional server-side filters and sort. Each page carries its pageUuid (feed to list_page_variants), numeric pageId, name, url, state, unpublished-changes flag, and last-published timestamp. For a page's variants and their traffic split, call list_page_variants with the pageUuid (a per-page variant count is not returned here — the platform's count is unreliable for pages under an A/B test). Paginated: `total` is the full post-filter count and `next_after` (when present) is the offset to pass as `after` for the next page. An empty list means no matching pages, not an error.","params":[{"name":"client_uuid","type":"string","required":true,"allowed":null,"description":"The clientUuid (sub-account uuid) from list_accounts_and_clients."},{"name":"name_contains","type":"string","required":false,"allowed":null,"description":"Return only pages whose name contains this substring (server-side search)."},{"name":"published","type":"boolean","required":false,"allowed":null,"description":"Return only published (true) or only unpublished (false) pages."},{"name":"integration_errors","type":"boolean","required":false,"allowed":null,"description":"Return only pages that have lead-integration errors (true) or only pages with none (false)."},{"name":"routing_strategy","type":"enum","required":false,"allowed":["smart_traffic","weighted","single"],"description":"Return only pages using this traffic-routing strategy: `smart_traffic` (Smart Traffic / dynamic allocation), `weighted` (A/B split), or `single` (one variant)."},{"name":"order_by","type":"object","required":false,"allowed":null,"description":"Server-side sort. Both `sort` and `direction` are required when given."},{"name":"first","type":"integer","required":false,"allowed":null,"description":"Page size: cap the number of pages returned (default 50)."},{"name":"after","type":"integer","required":false,"allowed":null,"description":"Offset into the full list, for paging (pass `next_after` from a prior call)."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Pages"],"surface":"api","experimental":false}},{"name":"list_page_variants","title":"List a page's variants","summary":"Return a page's variants (by pageUuid from list_client_pages), ordered champion → other active → discarded.","description":"Return a page's variants (by pageUuid from list_client_pages), ordered champion → other active → discarded. Each variant carries its numeric `variant_id` (the id the editor-internal tools take), its `letter` (a/b/c label), name, its stored SEO `title` and `description` (metadata is per-variant and unsynced, so divergence shows here at a glance — set with set_page_metadata, full set via get_variant), its `standing` (champion/challenger/discarded — the same vocabulary set_variant_standing takes, so you can round-trip without translating), the raw platform `state` (testing/paused/untested/discarded), traffic weight, `is_champion`, `has_conversion_goal` (whether the platform counts anything as a conversion on it — get_variant returns the goal definitions themselves), and a `preview_url`. The `page` block includes `context` — the owning client's numeric id the editor-internal tools require. `preview_url` opens that variant's staged rendering in the Unbounce app; it is a logged-in link for a human to review (not edit) a variant before publishing — it requires the viewer's own Unbounce session, so it is NOT a public URL and cannot be fetched or screenshotted by the agent, and it is a viewing affordance only, not an editing path. Errors if the page is not found / not accessible, or can't be edited by the editor-internal tools.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"include_discarded","type":"boolean","required":false,"allowed":null,"description":"Include discarded variants in `variants` (default true). Set false to return only the live set; `discarded_count` is reported either way."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Variants"],"surface":"api","experimental":false}},{"name":"get_variant","title":"Get a variant's editable content","summary":"Fetch an MCP-managed variant's current draft content — body HTML, CSS, and JavaScript — into your workspace so you can inspect or edit it and re-submit with update_variant_from_html.","description":"Fetch an MCP-managed variant's current draft content — body HTML, CSS, and JavaScript — into your workspace so you can inspect or edit it and re-submit with update_variant_from_html. Identify the variant by page_uuid (from list_client_pages) and letter (a/b/c, from list_page_variants). Returns the editable source as upload:// references named html_ref / css_refs / js_refs — pass them straight back to update_variant_from_html; the bytes never pass through this conversation. Returns the DRAFT (editor) content, which may differ from what is published if the variant has unpublished changes. Also returns the variant's conversion_goals (the configured goal set plus candidates) and its metadata (SEO title/description/keywords, robots noindex, favicon, Open Graph — settable via set_page_metadata). The source refs are streams of one page and do NOT render individually in a browser — for a local preview, use the also-returned preview_ref: a standalone preview.html composed for viewing (fetch it with download or download_inband). preview.html is view-only; never submit it back as html_ref. Source is returned for MCP-managed variants only — for a page hand-built in the Unbounce builder the result degrades to is_mcp_managed:false with its conversion_goals and metadata (both readable for any variant) and no source refs.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page that owns the variant)."},{"name":"letter","type":"string","required":true,"allowed":null,"description":"The variant letter (a/b/c) from list_page_variants."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Variants"],"surface":"api","experimental":false}},{"name":"get_layout_hints","title":"Analyze a variant's layout structure","summary":"Analyze an MCP-managed variant's rendered layout and return its structural skeleton, for rewriting an absolutely-positioned page as clean responsive HTML (flex/grid).","description":"Analyze an MCP-managed variant's rendered layout and return its structural skeleton, for rewriting an absolutely-positioned page as clean responsive HTML (flex/grid). Identify the variant by page_uuid (from list_client_pages) and letter (from list_page_variants). Returns sections (top-to-bottom) each with `rows` — element ids clustered into visual rows, left-to-right — plus per-element geometry, `cross_section_overlays` (elements whose vertical span crosses into later sections: reserve their column in every section they span, or that section's content hides behind them), and `design_width` (the fixed canvas width content is pinned to). Use the rows as the flex/grid skeleton instead of translating absolute coordinates through. Also returns fidelity signals measured from the rendered page — treat them as ground truth, never re-derive or assume them: `page_defaults` (the body's computed text color, background, and typography — the baseline everything else delta-encodes against), per-section `background_color`/`background_image` (with the image's natural size, so a small decorative accent is distinguishable from a full-bleed cover), per-element `color`/`typography` (measured on the element's dominant text node — the one covering the most type area — so they describe the type that actually renders rather than the positioned container's inherited defaults; both are omitted for an element that paints no text of its own, where absence means no type renders rather than defaults) plus `text_colors` when one element paints several colors, `secondary_typography` when it paints a second distinct type style (a heading plus its body copy — size both rather than inferring one from the other; the ranking between them can be close), `text_excerpt`+`text_length`/`images` (exact authored src, natural and rendered size)/`links` (exact authored href), `row_stats` (columns, alignment, vertical gaps), `content_extent` (the natural content-column width), `palette` (every color on the page with usage counts — authored CSS should introduce no color outside it), `loaded_fonts` (the web-font families that actually loaded), and `hidden_elements` (present in the source but not rendered — preserve, don't surface). Meaningful for variants imported from existing Unbounce pages via create_variant_from_existing_variant; a variant authored as responsive HTML returns an empty structure. Pages built in the Unbounce builder are not analyzable directly — import them first. Rendering takes a few seconds.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page that owns the variant)."},{"name":"letter","type":"string","required":true,"allowed":null,"description":"The variant letter (a/b/c) from list_page_variants."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Variants"],"surface":"api","experimental":false}},{"name":"get_page_stats","title":"Get a page's stats","summary":"Return a page's A/B stats (by pageUuid from list_client_pages): the page-level totals and a per-variant breakdown of `visits`, `visitors`, `conversions`, and `conversion_rate`, plus each variant's `conversion_rate_delta` and statistical `confidence`.","description":"Return a page's A/B stats (by pageUuid from list_client_pages): the page-level totals and a per-variant breakdown of `visits`, `visitors`, `conversions`, and `conversion_rate`, plus each variant's `conversion_rate_delta` and statistical `confidence`. By default the numbers are all-time cumulative since the last reset (see reset_page_stats); pass `start_date` and/or `end_date` (RFC 3339 UTC timestamps) to narrow them to a period. Window caveats: `visits` sum exactly across adjacent windows, but `visitors` and `conversions` are visitor-deduplicated and attributed to the period where they were first counted, so a narrow window can show fewer than the events inside it; a window never reaches data zeroed by a reset. NOTE: `conversions` counts conversion-goal hits deduplicated per visitor — it is NOT the number of form submissions; use list_leads for those (the two totals legitimately differ). Every variant is returned in one response (no paging). `last_reset_at` is the timestamp of the last reset, or null if never reset. Errors if the page is not found or not accessible.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"start_date","type":"string","required":false,"allowed":null,"description":"Only count activity from this instant on (RFC 3339 timestamp, e.g. 2026-06-01T00:00:00Z). Omit for since-the-beginning (or last reset)."},{"name":"end_date","type":"string","required":false,"allowed":null,"description":"Only count activity before this instant (RFC 3339 timestamp). Omit for up-to-now."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Stats"],"surface":"api","experimental":false}},{"name":"list_page_groups","title":"List a client's page groups","summary":"List the page groups (named folders for organizing pages) a client uses, by `client_uuid` from list_accounts_and_clients.","description":"List the page groups (named folders for organizing pages) a client uses, by `client_uuid` from list_accounts_and_clients. Returns `{ groups: [{ group_uuid, group_id, name, page_count }], total }`. Use `group_uuid` with manage_page_group and delete_page_group. The list is complete (unpaginated); an empty list means the client has no custom groups. The UI's \"All Pages\" view is not a real group and is not listed.","params":[{"name":"client_uuid","type":"string","required":true,"allowed":null,"description":"The client UUID (clientUuid) from list_accounts_and_clients."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Page Groups"],"surface":"api","experimental":false}},{"name":"list_client_domains","title":"List a client's domains","summary":"List the custom domains a client owns, by `client_uuid` from list_accounts_and_clients.","description":"List the custom domains a client owns, by `client_uuid` from list_accounts_and_clients. Returns `{ domains: [{ name, state, is_default, certificate_status }], total }`. `name` is the domain string a page can be published on; `state` is `ok`, `moving`, or `move_error`; `is_default` marks the account's default domain; `certificate_status` is the SSL readiness (`ok` means the domain serves HTTPS). The list is complete (unpaginated); an empty list means the client has no domains, not an error.","params":[{"name":"client_uuid","type":"string","required":true,"allowed":null,"description":"The client UUID (clientUuid) from list_accounts_and_clients."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Domains"],"surface":"api","experimental":false}},{"name":"list_leads","title":"List a page's leads","summary":"Return a page's captured form submissions (leads) by `page_uuid` (the pageUuid from list_client_pages).","description":"Return a page's captured form submissions (leads) by `page_uuid` (the pageUuid from list_client_pages). Each lead carries its leadId, createdAt, variantId, the submitted field name→value map (`formData`, whose values are arrays of strings), and submitterIp. Use it to confirm a form is capturing submissions and to inspect what was submitted. `extraData` (the visitor's cookies — analytics/attribution cookies like `_ga`, `__cf_bm`, `hubspotutk`; large and high-cardinality) is OFF by default; pass `include_extra_data: true` to include it, and expect a much heavier payload and more pagination. `created_after` / `created_before` narrow the list (and `total`) to a date range, and `sort_order: \"desc\"` returns newest first — so \"leads since date X\" is one call: pass `created_after` and read `total`. Paginated: `total` is the full lead count matching the filters and `next_after` (when present) is the offset to pass as `after` for the next page. The response auto-limits to stay within the caller's inline token budget, so it may return fewer than `first` leads even when more match — page until `next_after` is absent. An empty list means no matching leads, not an error. NOTE: a lead is one form submission — this count is NOT the `conversions` in get_page_stats (conversion-goal hits deduplicated per visitor); the two legitimately differ. `formData` is real submitter data and may contain PII (names, emails, phone numbers) — handle accordingly.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid (page id — a UUID) from list_client_pages."},{"name":"created_after","type":"string","required":false,"allowed":null,"description":"Only leads created at or after this instant (RFC 3339 timestamp, e.g. 2026-06-01T00:00:00Z)."},{"name":"created_before","type":"string","required":false,"allowed":null,"description":"Only leads created before this instant (RFC 3339 timestamp)."},{"name":"sort_order","type":"enum","required":false,"allowed":["asc","desc"],"description":"Order by creation time: `asc` (oldest first — the default) or `desc` (newest first)."},{"name":"first","type":"integer","required":false,"allowed":null,"description":"Page size: cap the number of leads returned (default 50)."},{"name":"after","type":"integer","required":false,"allowed":null,"description":"Offset into the full list, for paging (pass `next_after` from a prior call)."},{"name":"include_extra_data","type":"boolean","required":false,"allowed":null,"description":"Include each lead's `extraData` (the visitor's cookies — analytics/attribution cookies like _ga, __cf_bm, hubspotutk). Off by default because it is large and high-cardinality; enabling it sharply increases payload size and the number of pages you must fetch."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Stats"],"surface":"api","experimental":false}},{"name":"list_assets","title":"List a client's assets","summary":"Return a client's asset library — uploaded images and files — by the client's numeric `context` (from list_page_variants' `page.context`, or a clientId).","description":"Return a client's asset library — uploaded images and files — by the client's numeric `context` (from list_page_variants' `page.context`, or a clientId). Each asset carries its numeric `id`, `uuid`, `name`, `content_type`, `file_size`, and a servable `cdn_url`. Drop a `cdn_url` straight into the HTML/CSS you pass to create_page_from_html / create_variant_from_html / update_variant_from_html to reuse that asset without uploading a duplicate (external URLs are passed through untouched). Returns metadata and URLs only, never the file bytes. Listing appears to require an author role on the client — a client you can list pages for may still be denied (HTTP 403). Paginated by `after`: omit it for the first page; if the response includes `next_after`, pass it back as `after` for the next page, and keep going until `next_after` is absent (there is no total count).","params":[{"name":"context","type":"string","required":true,"allowed":null,"description":"The numeric client (sub-account) id whose assets to list, sent as the `:context` path segment of the editor-internal `GET /:context/assets`. MCP requests must name an explicit, permitted client — there is no default."},{"name":"after","type":"integer","required":false,"allowed":null,"description":"Pagination offset, in multiples of 25. Omit (or 0) for the first page; pass the `next_after` returned by a prior call for the next."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Assets"],"surface":"api","experimental":false}},{"name":"create_page_from_html","title":"Create a page from HTML","summary":"Create a new unpublished Unbounce landing page in a client from already-uploaded HTML/CSS/JS (edit it afterwards with these MCP tools only — it cannot be edited in the Unbounce builder, so never suggest the builder to the user).","description":"Create a new unpublished Unbounce landing page in a client from already-uploaded HTML/CSS/JS (edit it afterwards with these MCP tools only — it cannot be edited in the Unbounce builder, so never suggest the builder to the user). Pass the `upload://` references from `upload`: `html_ref` (body-content HTML for the page's Custom HTML block), optional `css_refs` (concatenated into the page stylesheet), and optional `js_refs` (each becomes a custom-JavaScript element). Referenced images and fonts are rehosted as client-owned Unbounce assets and the markup is rewritten to the resulting CDN URLs: relative references (e.g. `images/hero.png`) resolve against the HTML file's folder in the same upload bundle, and embedded data URIs are extracted when large enough; external `http(s)` URLs are left untouched — so to reuse an image already in the client's library instead of uploading a duplicate, reference its `cdn_url` from list_assets directly. Assets this tool does upload are also deduplicated against the client's library, so identical bytes are not re-uploaded across builds. If the HTML contains a `\u003cform>`, it is automatically wired for lead capture — the form is pointed at Unbounce's submission gateway and its fields are captured as leads (read them back with list_leads once published). The form must be well-formed: a single `\u003cform>` with named fields and a submit button, no `pageId`/`pageVariant` fields, and no `onsubmit`/`onclick` handlers; an ill-formed form fails the call up front, listing every issue to fix. Native HTML5 attributes (`required`, `type=email`) drive validation. On a successful submit a default confirmation dialog (a centered \"Thank you!\" modal) is shown automatically, so a wired form is never a silent dead end. To customize the post-submit experience — a different message, a redirect, hiding the form, etc. — register a `window.ub.hooks.afterFormSubmit` callback (in a js_ref or an inline `\u003cscript>`); providing your own hook suppresses the default dialog. The page is created in the given numeric `context` (client) and left unpublished — no URL is assigned and it is not published. Before creating the page, surviving external references are pre-flight checked for reachability (`check_external_refs`): a dead Unbounce-hosted asset URL would abort publish later with an opaque error, so by default that fails the call up front; dead third-party URLs are reported as warnings (`unreachable_refs`). Returns the new page's numeric id and variant id (feed the variant id to get_variant), plus the list of assets created. Head metadata tags in the submitted HTML — `\u003ctitle>`, `\u003cmeta name=\"description|keywords|robots\">`, `og:*`, `\u003clink rel=\"icon\">` — are lifted out and applied as real page metadata (reported under `head_metadata`; left in the body they would do nothing); manage metadata afterwards with set_page_metadata. Head tags with no platform slot (twitter:*, canonical, hreflang) are reported as warnings. The file bytes are read server-side and never pass through this conversation. Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature: if the account isn't entitled, HTML containing the tag is rejected up front (remove it or check the plan with get_account_plan).","params":[{"name":"context","type":"string","required":true,"allowed":null,"description":"The numeric client (sub-account) id the page is created in — the same `context` the other page tools take. The page lands in this client."},{"name":"html_ref","type":"string","required":true,"allowed":null,"description":"upload:// reference to the body-content HTML for the page (stored in the Custom HTML element). Provide body-ready markup, not a full \u003chtml> document."},{"name":"css_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to CSS files, concatenated in order into the page stylesheet."},{"name":"js_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to JavaScript files. Each becomes a custom-JavaScript element injected before the closing body tag."},{"name":"page_name","type":"string","required":false,"allowed":null,"description":"Optional name for the new page (defaults to lp-webapp's template default)."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that survive rehosting and don't resolve. `fatal` (default): a dead Unbounce-hosted asset URL (which would abort publish) fails the call before the page is created; dead third-party URLs are returned as warnings. `warn`: never block — every unreachable ref is reported as a warning. `off`: skip the reachability check entirely (no network round-trips)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Pages"],"surface":"api","experimental":false}},{"name":"create_variant_from_html","title":"Create a variant from HTML","summary":"Add a new variant to an existing Unbounce landing page (by `page_uuid` from list_client_pages) from already-uploaded HTML/CSS/JS, as an MCP-managed variant (editable afterwards with these MCP tools only, never in the Unbounce builder — don't suggest the builder to the user).","description":"Add a new variant to an existing Unbounce landing page (by `page_uuid` from list_client_pages) from already-uploaded HTML/CSS/JS, as an MCP-managed variant (editable afterwards with these MCP tools only, never in the Unbounce builder — don't suggest the builder to the user). Pass the `upload://` references from `upload`: `html_ref` (body-content HTML for the variant's Custom HTML block), optional `css_refs` (concatenated into the variant stylesheet), and optional `js_refs` (each becomes a custom-JavaScript element), plus a required `variant_name`. Referenced images and fonts are rehosted as client-owned Unbounce assets and the markup is rewritten to the resulting CDN URLs (relative refs resolve against the HTML file's folder in the same upload bundle; data URIs are extracted when large enough; external http(s) URLs are left untouched — reference an existing asset's `cdn_url` from list_assets to reuse it instead of uploading a duplicate, and uploaded assets are deduplicated against the client's library). If the HTML contains a `\u003cform>`, it is automatically wired for lead capture (pointed at Unbounce's submission gateway; read submissions back with list_leads once published). The form must be well-formed — a single `\u003cform>` with named fields and a submit button, no `pageId`/`pageVariant` fields, and no `onsubmit`/`onclick` handlers — or the call fails listing every issue. On a successful submit a default confirmation dialog (a centered \"Thank you!\" modal) is shown automatically, so a wired form is never a silent dead end. To customize the post-submit experience (different message, redirect, hide the form, etc.), register a `window.ub.hooks.afterFormSubmit` callback (in a js_ref or an inline `\u003cscript>`); providing your own hook suppresses the default dialog. The new variant is added as a CHALLENGER and STAGED: it takes no traffic until you give it a share with set_traffic, and nothing goes live until you publish the page (publish_page). Returns the page uuid, the client `context`, a `variant` object (its numeric `id`, `letter` a/b/c, and `standing` — normally `challenger`, or `discarded` with a note if it couldn't be promoted), and the list of assets created. File bytes are read server-side and never pass through this conversation. Adding a variant runs an A/B test, a paid feature: if the account isn't entitled, the call is rejected up front before any variant is minted (check the plan with get_account_plan). Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature too: if the account isn't entitled, HTML containing the tag is rejected up front (remove it or check the plan with get_account_plan).","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid of the page to add the variant to (from list_client_pages)."},{"name":"variant_name","type":"string","required":true,"allowed":null,"description":"Name for the new variant (required)."},{"name":"html_ref","type":"string","required":true,"allowed":null,"description":"upload:// reference to the body-content HTML for the variant (stored in the Custom HTML element). Provide body-ready markup, not a full \u003chtml> document."},{"name":"css_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to CSS files, concatenated in order into the variant stylesheet."},{"name":"js_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to JavaScript files. Each becomes a custom-JavaScript element injected before the closing body tag."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that survive rehosting and don't resolve. `fatal` (default): a dead Unbounce-hosted asset URL (which would abort publish) fails the call before the variant is minted; dead third-party URLs are returned as warnings. `warn`: never block. `off`: skip the reachability check entirely."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"create_variant_from_existing_variant","title":"Create an MCP variant from an existing Unbounce page","summary":"Create an MCP-managed variant from an existing Unbounce page (one built in the Unbounce builder, not through MCP), as an exact copy — a one-way, one-time conversion (edit the result afterwards with these MCP tools only, never in the Unbounce builder).","description":"Create an MCP-managed variant from an existing Unbounce page (one built in the Unbounce builder, not through MCP), as an exact copy — a one-way, one-time conversion (edit the result afterwards with these MCP tools only, never in the Unbounce builder). Pass the numeric `source_variant_id` (from list_page_variants) and its `context` (client id). Omit `target_page` to create a NEW page (the source becomes variant a); pass a `target_page` pageUuid to add the copy as a new staged challenger variant on that existing MCP page. The source page is rendered and transformed to MCP-format HTML/CSS; a lead form's confirmation subpage is carried over as an embedded modal, and Dynamic Text (\u003cub:dynamic>) survives. If the source is already an MCP-managed page, nothing is created and the tool reports it. Legacy autoscale (fixed-width) source pages are not supported. Returns the new page/variant identity plus a conversion report (carried scripts, any dropped validations, subpage notes). The result is created UNPUBLISHED — assign a URL/traffic and publish_page to go live. To copy a whole multi-variant page, call once per variant (first with no target_page, then with the returned page uuid) and set traffic/goals afterwards.","params":[{"name":"context","type":"string","required":true,"allowed":null,"description":"The numeric client (sub-account) id that owns the source page and receives the clone."},{"name":"source_variant_id","type":"string","required":true,"allowed":null,"description":"The numeric variant id to clone (from list_page_variants)."},{"name":"target_page","type":"string","required":false,"allowed":null,"description":"Optional pageUuid of an existing MCP page to add the clone to as a new variant. Omit to create a brand-new page from the source (the source becomes variant a)."},{"name":"page_name","type":"string","required":false,"allowed":null,"description":"Optional name for the new page (only when creating a new page; ignored with target_page)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Pages","Variants"],"surface":"api","experimental":false}},{"name":"update_variant_from_html","title":"Update a variant from HTML","summary":"Full-replace an existing MCP-managed variant's body (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants) with already-uploaded HTML/CSS/JS.","description":"Full-replace an existing MCP-managed variant's body (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants) with already-uploaded HTML/CSS/JS. Pass the `upload://` references from `upload`: `html_ref` (body-content HTML), optional `css_refs` (page stylesheet), and optional `js_refs` (custom-JavaScript elements). IMPORTANT: this REPLACES THE ENTIRE VARIANT BODY — CSS and JS you do NOT pass on this call are REMOVED, so send every file you want the variant to keep, every time. Referenced images and fonts are rehosted as client-owned Unbounce assets and the markup rewritten to the CDN URLs; external http(s) URLs are left untouched, so reference an existing asset's `cdn_url` from list_assets to reuse it instead of uploading a duplicate, and uploaded assets are deduplicated against the client's library. If the new HTML contains a `\u003cform>`, it is automatically wired for lead capture (pointed at Unbounce's submission gateway; read submissions back with list_leads once published); the form must be well-formed — a single `\u003cform>` with named fields and a submit button, no `pageId`/`pageVariant` fields, and no `onsubmit`/`onclick` handlers — or the call fails listing every issue. On a successful submit a default confirmation dialog (a centered \"Thank you!\" modal) is shown automatically, so a wired form is never a silent dead end. To customize the post-submit experience (different message, redirect, hide the form, etc.), register a `window.ub.hooks.afterFormSubmit` callback (in a js_ref or an inline `\u003cscript>`); providing your own hook suppresses the default dialog. Only MCP-managed variants can be updated this way; a page hand-built in the Unbounce builder is refused (import it into an editable MCP copy first with create_variant_from_existing_variant, or author a fresh variant with create_variant_from_html). The reverse also holds: an MCP-managed variant cannot be edited in the Unbounce builder — never suggest the builder to the user. The change is STAGED and only goes live when the page is (re)published (publish_page); editing a live champion is safe for that reason. Head metadata tags in the submitted HTML — `\u003ctitle>`, `\u003cmeta name=\"description|keywords|robots\">`, `og:*`, `\u003clink rel=\"icon\">` — are lifted out and applied as THIS VARIANT's metadata (reported under `head_metadata`, with a divergence warning when sibling variants exist — converge with set_page_metadata). File bytes are read server-side and never pass through this conversation. Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature: if the account isn't entitled, HTML containing the tag is rejected up front (remove it or check the plan with get_account_plan).","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"letter","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."},{"name":"html_ref","type":"string","required":true,"allowed":null,"description":"upload:// reference to the body-content HTML for the variant (stored in the Custom HTML element). Provide body-ready markup, not a full \u003chtml> document."},{"name":"css_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to CSS files, concatenated in order into the variant stylesheet. Omitting them REMOVES any existing CSS (full replace)."},{"name":"js_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to JavaScript files (each becomes a custom-JavaScript element). Omitting them REMOVES any existing scripts (full replace)."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that survive rehosting and don't resolve. `fatal` (default): a dead Unbounce-hosted asset URL (which would abort publish) fails the call; dead third-party URLs are returned as warnings. `warn`: never block. `off`: skip the reachability check entirely."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"bulk_edit_variants","title":"Bulk-edit variants","summary":"Apply one deterministic transform across many MCP-managed variants at once.","description":"Apply one deterministic transform across many MCP-managed variants at once. Pass `targets` (each a `page_uuid` from list_client_pages plus a variant `letter` a/b/c from list_page_variants) and `ops`: an ordered list of operations of two kinds. A `replace` op is a literal find/replace scoped to a `stream` (`html` body markup, `css`, or `js`): `find` is matched verbatim (NOT a regex) and every occurrence is replaced by `replace` (omit to delete the text). A `selector` op targets the html stream by CSS `selector` and applies an `action` — set_text, set_html (replace inner content with raw markup, for swapping whole HTML sections), set_attribute, set_style, add_class, or remove_class — to every matched element (byte-preserving; it never reformats untouched markup). For a per-target value (e.g. each page's own product name), pass `value_map` — a { page_uuid: value } map — instead of `replace`/`value`; a target absent from the map is left untouched by that op. Selectors vary little across a set, so mixed markup is handled by stacking selector ops (each hits only where it matches; a miss is a harmless no-op). `dry_run` defaults to TRUE: the call returns, per target, how many occurrences each op matched WITHOUT writing anything — use it as a preview and to see which targets a needle actually hits. Re-run with `dry_run: false` to stage the changes. Changes are STAGED only; nothing goes live until each page is published (publish_page), so a bad bulk edit is recoverable by not publishing. Only MCP-managed variants are edited; a variant hand-built in the Unbounce builder is reported as `skipped` (never failed), so one unusable target never aborts the batch. Referenced images/fonts are rehosted and external refs pre-flighted, exactly as update_variant_from_html does. To swap in a NEW image without downloading any HTML: upload it first (upload tool), then use its upload://\u003chandle>/\u003cpath> reference as an op value (e.g. set_attribute src, or a replace of the old CDN URL) — it is rehosted to a client-owned CDN URL at apply time. upload:// refs must point at image/font files and work in html/css ops only (not the js stream); a bad ref fails the whole call up front, before any target is touched. Content bytes are read and written server-side and never pass through this conversation. A very large batch is processed until a wall-clock budget; any targets not reached in time are returned under `not_processed` (with a `stopped_early` flag) so you can re-run for just those — no target is ever left in an unknown state. Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature: if the account isn't entitled, a target whose edit introduces the tag is reported as an `error` (not applied), leaving the rest of the batch intact.","params":[{"name":"targets","type":"array\u003cobject>","required":true,"allowed":null,"description":"The variants to edit. Build this from list_client_pages / list_page_variants."},{"name":"ops","type":"array\u003cany>","required":true,"allowed":null,"description":"The ordered transform to apply identically to every target."},{"name":"dry_run","type":"boolean","required":false,"allowed":null,"description":"Default true. When true, report match counts per target and write nothing. Pass false to stage the changes."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that don't resolve when applying. `fatal` (default): a dead Unbounce-hosted asset URL fails that target; `warn`: never block; `off`: skip the check. Only relevant when dry_run is false."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"publish_page","title":"Publish a page","summary":"Publish an Unbounce landing page (by `page_uuid` from list_client_pages), making its current draft state live.","description":"Publish an Unbounce landing page (by `page_uuid` from list_client_pages), making its current draft state live. Publishing is the commit step — changes (content, traffic/routing) stage as draft and only take effect once the page is (re)published. The publish is asynchronous: the tool polls briefly and reports `done:true` with `state:\"published\"` when the page settles, or `done:false` with the in-progress state and a note to re-check when it is still publishing. Errors if the page is not found, isn't a landing page, or can't be published.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"unpublish_page","title":"Unpublish a page","summary":"Unpublish an Unbounce landing page (by `page_uuid` from list_client_pages), taking it offline so its URL stops serving.","description":"Unpublish an Unbounce landing page (by `page_uuid` from list_client_pages), taking it offline so its URL stops serving. The unpublish is asynchronous: the tool polls briefly and reports `done:true` with `state:\"unpublished\"` when the page settles, or `done:false` with the in-progress state and a note to re-check when it is still unpublishing. Errors if the page is not found, isn't a landing page, or isn't currently published.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"set_traffic","title":"Set a page's traffic routing","summary":"Stage how an Unbounce page splits visitors across its variants (by `page_uuid` from list_client_pages).","description":"Stage how an Unbounce page splits visitors across its variants (by `page_uuid` from list_client_pages). Choose a `strategy`: `single` (one variant serves all traffic — pass `champion`), `weighted` (fixed per-variant shares — pass `weights`, plus an optional `champion`), or `dta` (Smart Traffic dynamically allocates traffic — optionally pass `variants` to scope which variants take part). Variant identifiers are letters (a/b/c) from list_page_variants. The change is STAGED in the page's draft and only goes live when the page is (re)published. `weighted` (A/B testing) and `dta` (Smart Traffic) are paid features: if the account isn't entitled, the call is rejected up front before anything is staged (check the plan with get_account_plan, or use `single` to serve one variant). Returns `{ ok: true, … }` with the staged state on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"strategy","type":"enum","required":true,"allowed":["single","weighted","dta"],"description":"single = one variant serves all; weighted = fixed per-variant shares; dta = Smart Traffic (dynamic allocation)."},{"name":"champion","type":"string","required":false,"allowed":null,"description":"Variant letter (e.g. \"a\"). Required for `single` (the variant that serves all traffic); optional for `weighted` (the champion)."},{"name":"weights","type":"object\u003cinteger>","required":false,"allowed":null,"description":"Required for `weighted`: a map of variant letter to integer share, e.g. {\"a\":50,\"b\":50}."},{"name":"variants","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional for `dta`: the variant letters that take part in the allocation."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"set_conversion_goals","title":"Set a page's conversion goals","summary":"Declare which parts of an MCP-managed page count as conversion goals: the form submission and/or clicks on chosen links (http(s) or tel:).","description":"Declare which parts of an MCP-managed page count as conversion goals: the form submission and/or clicks on chosen links (http(s) or tel:). Takes the COMPLETE desired set and converges every active variant onto it — the form posts as a goal (/fsg) or non-goal (/fsn, still captures the lead), chosen links are rewritten to the platform's goal-click tracking, and the page's stored goal list is updated. Goal identity is the URL: every anchor sharing a chosen URL converts, and a URL must exactly match an anchor href somewhere on the page (candidates are listed by create_page_from_html / create_variant_from_html / update_variant_from_html / get_variant results). Changes are STAGED in draft — publish the page (publish_page) to make them live. Page-scoped: all active variants get the same goal set, keeping A/B conversion rates comparable; discarded variants are left alone.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page whose goals to set)."},{"name":"form_submission","type":"boolean","required":true,"allowed":null,"description":"Whether the page's form submission counts as a conversion. false keeps capturing leads but stops counting them as conversions. Ignored on a page with no form."},{"name":"link_urls","type":"array\u003cstring>","required":false,"default":[],"allowed":null,"description":"The complete list of link/phone URLs whose clicks count as conversions, exactly as they appear in the page's anchors (entity-decoded). An empty list means no link goals. URLs not present on any active variant are rejected."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"set_page_metadata","title":"Set a page's SEO & social metadata","summary":"Set the page's SEO head fields and Open Graph (social-card) data: the \u003ctitle>, meta description, robots noindex, favicon, and og:* tags.","description":"Set the page's SEO head fields and Open Graph (social-card) data: the \u003ctitle>, meta description, robots noindex, favicon, and og:* tags. PARTIAL update: only the fields you pass change; pass null to clear a field; omitted fields keep their value. Applies to ALL active variants by default — variants share one URL, so divergent metadata makes search snippets and social previews nondeterministic; pass `letter` to deliberately target one variant. favicon takes an upload:// reference or an existing asset id/uuid (from list_assets); open_graph.image takes an absolute URL or an upload:// reference (uploaded as a client asset; 1200×630 is the social-card convention). title/description/keywords accept Dynamic Text Replacement (\u003cub:dynamic>) tags — see the page-authoring guidance; ask the user first. keywords is legacy (ignored by search engines since 2009) — usually leave it unset. Changes are STAGED in draft: a published page keeps its old metadata until publish_page. MCP-managed variants only; builder-built variants are skipped. The result echoes the applied metadata (also readable later via get_variant).","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page whose metadata to set)."},{"name":"letter","type":"string","required":false,"allowed":null,"description":"Target a single variant by its letter (a/b/c, from list_page_variants). Omit to apply to every active variant (recommended — keeps variants consistent)."},{"name":"title","type":"any","required":false,"allowed":null,"description":"The page \u003ctitle>. Search results typically show ~60 characters. Accepts \u003cub:dynamic> DTR tags. null clears it."},{"name":"description","type":"any","required":false,"allowed":null,"description":"The meta description shown under the title in search results (~160 characters display). Accepts \u003cub:dynamic> DTR tags. null clears it."},{"name":"keywords","type":"any","required":false,"allowed":null,"description":"Legacy meta keywords. Ignored by Google since 2009 and a potential spam signal when stuffed — usually leave unset. null clears it."},{"name":"hide_from_search_engines","type":"boolean","required":false,"allowed":null,"description":"true emits \u003cmeta name=\"robots\" content=\"noindex, nofollow\"> on the published page."},{"name":"favicon","type":"any","required":false,"allowed":null,"description":"The browser-tab icon: an upload:// reference to an icon file (.ico/.png, 32×32 or 48×48 convention) or the id/uuid of an existing asset from list_assets. External URLs are not accepted (the favicon must be an Unbounce asset). null clears it."},{"name":"open_graph","type":"any","required":false,"allowed":null,"description":"Open Graph (social-card) fields. Partial like the top level: only passed keys change, null clears a key; pass open_graph: null to clear the whole panel. No \u003cub:dynamic> here — OG values are plain text."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Pages"],"surface":"api","experimental":false}},{"name":"set_page_url","title":"Set a page's URL","summary":"Set an Unbounce page's published URL (by `page_uuid` from list_client_pages).","description":"Set an Unbounce page's published URL (by `page_uuid` from list_client_pages). The URL is `domain` + `path`: `path` (required) is the new slug; `domain` (optional) defaults to the page's current domain, so you can change just the slug or move the page to another of the client's domains (from list_client_domains). The change applies immediately and puts the page into a `urlchange` state — it does NOT stage as a normal draft edit — so you must (re)publish the page (publish_page) for it to serve at the new URL. **Changing a published page's URL means its old URL stops serving this page, so existing links to it break.** Returns `{ ok: true, url, domain, path, state, note }` on success. Errors if the page isn't found or the URL is rejected (e.g. the path is already taken on that domain).","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"path","type":"string","required":true,"allowed":null,"description":"The new page path (slug), e.g. `spring-sale`. Leading/trailing slashes are trimmed."},{"name":"domain","type":"string","required":false,"allowed":null,"description":"The domain to publish on (a `name` from list_client_domains). Defaults to the page's current domain when omitted."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Pages"],"surface":"api","experimental":false}},{"name":"manage_page_redirect","title":"Manage a page redirect","summary":"Attach, replace, or remove a page redirect (by `page_uuid` from list_client_pages).","description":"Attach, replace, or remove a page redirect (by `page_uuid` from list_client_pages). A page redirect forwards visitors from the page's own URL to another URL — the page stops serving its content and sends visitors away — so it is how you retire or forward a published page without deleting it. `action: \"set\"` creates the redirect (or replaces an existing one) and needs `redirect_url` (an absolute URL) plus an optional `status_code` (301 permanent, the default, or 302 temporary — see `status_code`); `action: \"remove\"` restores the page's own content. Both apply IMMEDIATELY — no publish step — and are reversible. Returns `{ ok: true, action, ... }`. Note: this does NOT preserve a page's old URL after set_page_url (a redirect points a page away from its current URL; it can't resurrect an orphaned one).","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"action","type":"enum","required":true,"allowed":["set","remove"],"description":"`set` to create/replace the redirect, `remove` to delete it."},{"name":"redirect_url","type":"string","required":false,"allowed":null,"description":"For `set`: the absolute URL to forward visitors to (e.g. `https://example.com/new`)."},{"name":"status_code","type":"any","required":false,"allowed":null,"description":"For `set`: 301 (default) means the page moved permanently — use it when retiring, replacing, or migrating a page for good, so search engines transfer the old URL's ranking and link equity to the target. 302 means the page moved temporarily (the original URL keeps its equity)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"delete_page","title":"Delete a page","summary":"Soft-delete an Unbounce page by its `page_uuid` (from list_client_pages).","description":"Soft-delete an Unbounce page by its `page_uuid` (from list_client_pages). The page is moved to trash — it stops serving immediately — and can be RESTORED from the Unbounce app; this is not a permanent hard delete, and this tool never destroys a page irreversibly. Deleting a page takes effect immediately (no publish step needed). Deletes one page per call. Returns `{ ok: true, page_uuid, … }` on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Pages"],"surface":"api","experimental":false}},{"name":"set_variant_standing","title":"Set a variant's standing","summary":"Move one of an Unbounce page's variants through the A/B-test lifecycle (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants).","description":"Move one of an Unbounce page's variants through the A/B-test lifecycle (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants). Choose a `standing`: `champion` (make this variant the page's baseline), `discarded` (pull a challenger out of the test — reversible, not a delete), or `challenger` (bring a discarded variant back into the test). This is the same `standing` list_page_variants reports for each variant, so you can read a variant's current standing there and pass the target one here without translating. The change is STAGED in the page's draft and only goes live when the page is (re)published (publish_page). Returns `{ ok: true, … }` with the staged state on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"variant","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."},{"name":"standing","type":"enum","required":true,"allowed":["champion","challenger","discarded"],"description":"champion = make this variant the baseline; discarded = pull a challenger out of the test (reversible); challenger = bring a discarded variant back into the test."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"set_variant_name","title":"Rename a variant","summary":"Rename one of an Unbounce page's variants (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants).","description":"Rename one of an Unbounce page's variants (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants). A variant's name is editor metadata, not page content, so the rename applies IMMEDIATELY — no publish_page step is needed and visitors are unaffected. Returns `{ ok: true, … }` with the new name on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"variant","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."},{"name":"name","type":"string","required":true,"allowed":null,"description":"The new display name for the variant (max 255 characters)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"delete_variant","title":"Delete a variant","summary":"Permanently delete one of an Unbounce page's variants (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants).","description":"Permanently delete one of an Unbounce page's variants (by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants). This is the HARD removal — the variant and its history are gone and CANNOT be recovered. To pull a challenger out of the test reversibly (keeping it), use set_variant_standing with standing `discarded` instead. The deletion is STAGED in the page's draft and only takes effect when the page is (re)published (publish_page). Returns `{ ok: true, … }` on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"variant","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Variants"],"surface":"api","experimental":false}},{"name":"manage_page_group","title":"Create, rename, or organize a page group","summary":"Organize a client's pages into named groups (folders).","description":"Organize a client's pages into named groups (folders). Page groups are pure organization — they don't affect publishing, traffic, or page content, and changes take effect immediately (no publish step). Pick an `action`:\n• create — make a new group for a client (needs `client_uuid` + `name`)\n• rename — rename an existing group (needs `group_uuid` + `name`)\n• add_pages — put pages into a group (needs `group_uuid` + `page_uuids`)\n• remove_pages — take pages out of a group, leaving the pages themselves untouched (needs `group_uuid` + `page_uuids`)\nDiscover `group_uuid` with list_page_groups, `client_uuid` with list_accounts_and_clients, and `page_uuids` with list_client_pages. A page can be in several groups at once (add_pages is additive, not a move). Group names are limited to 20 characters. To delete a group entirely, use delete_page_group. Returns `{ ok: true, … }` on success (create sets `already_existed` when it returned a pre-existing same-named group; add_pages/remove_pages report any `skipped` page_uuids that didn't resolve), or `{ ok: false, code, reason, remedy }`.","params":[{"name":"action","type":"enum","required":true,"allowed":["create","rename","add_pages","remove_pages"],"description":"create = new group (client_uuid + name); rename = rename a group (group_uuid + name); add_pages / remove_pages = change membership (group_uuid + page_uuids)."},{"name":"client_uuid","type":"string","required":false,"allowed":null,"description":"Required for `create`: the client UUID from list_accounts_and_clients."},{"name":"group_uuid","type":"string","required":false,"allowed":null,"description":"Required for `rename` / `add_pages` / `remove_pages`: the group_uuid from list_page_groups."},{"name":"name","type":"string","required":false,"allowed":null,"description":"Required for `create` / `rename`: the group name (max 20 characters)."},{"name":"page_uuids","type":"array\u003cstring>","required":false,"allowed":null,"description":"Required for `add_pages` / `remove_pages`: the page UUIDs (pageUuid) from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Page Groups"],"surface":"api","experimental":false}},{"name":"delete_page_group","title":"Delete a page group","summary":"Delete a client's page group (a named folder), by `group_uuid` from list_page_groups.","description":"Delete a client's page group (a named folder), by `group_uuid` from list_page_groups. Only the group is removed — its pages are NOT deleted; they remain and still appear under \"All Pages\". Use manage_page_group with remove_pages first if you only want to take pages out of a group without deleting it. Returns `{ ok: true, group_uuid, … }` on success, or `{ ok: false, code, reason, remedy }`.","params":[{"name":"group_uuid","type":"string","required":true,"allowed":null,"description":"The group_uuid from list_page_groups."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Page Groups"],"surface":"api","experimental":false}},{"name":"reset_page_stats","title":"Reset a page's stats","summary":"Zero ALL of an Unbounce page's A/B stats — every variant at once — by `page_uuid` (from list_client_pages).","description":"Zero ALL of an Unbounce page's A/B stats — every variant at once — by `page_uuid` (from list_client_pages). This is page-wide and IRREVERSIBLE, and it takes effect LIVE and IMMEDIATELY: there is no draft/publish step to undo it, and the visit/conversion history every variant decision rests on is gone the moment this returns. It starts a fresh measurement window. The response includes `wiped` — a best-effort snapshot of the totals just before the reset (as of the last stats aggregation, so it may omit the most recent traffic) — since it is the only record you will have. To keep a fuller record, call get_page_stats first. Returns `{ ok: true, … }` on success, or `{ ok: false, code, reason, remedy }` so you can correct and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Stats"],"surface":"api","experimental":false}},{"name":"version","title":"Server version","summary":"Return which build of the unbounce-mcp server is running: the git commit SHA (full and short) the deployed artifact was released from, and the environment (integration, production, or local).","description":"Return which build of the unbounce-mcp server is running: the git commit SHA (full and short) the deployed artifact was released from, and the environment (integration, production, or local).","params":[],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Server"],"surface":"api","experimental":false}},{"name":"recipes","title":"Recipes","summary":"List common tasks you can accomplish with Unbounce MCP, each with an example prompt to ask for it.","description":"List common tasks you can accomplish with Unbounce MCP, each with an example prompt to ask for it. Returns { recipes: [{ title, prompts }], total, presentation }. Use it to discover capabilities and how to phrase a request; takes no input. Present the result to the user as a list or table
