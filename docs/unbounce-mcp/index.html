<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unbounce MCP — Tool Reference</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #1b1f24;
    --muted: #5b6470;
    --line: #e3e6ea;
    --line-strong: #cdd2d9;
    --accent: #2b6cb0;
    --code-bg: #f1f3f5;
    --read: #2b8a5b;
    --read-bg: #e6f4ec;
    --write: #b7791f;
    --write-bg: #fbf0d9;
    --destructive: #c0392b;
    --destructive-bg: #fbe6e3;
    --req: #c0392b;
    --radius: 8px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    font-size: 15px;
  }
  a { color: var(--accent); }
  header.top {
    background: linear-gradient(135deg, #1a2533, #243447);
    color: #fff;
    padding: 28px 0 24px;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  header.top h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.01em; }
  header.top .sub { color: #b6c2d1; font-size: 14px; }
  header.top .sub code { font-family: var(--mono); font-size: 12.5px; color: #9fd0ff; background: none; padding: 0; }

  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .toolbar .wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #search {
    flex: 1 1 280px;
    padding: 9px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: var(--sans);
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .group-by { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .group-by select {
    border: 1px solid var(--line-strong);
    background: var(--panel);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-size: 13px;
    font-family: var(--sans);
    color: var(--ink);
    cursor: pointer;
  }
  .ctrl-btn {
    border: 1px solid var(--line-strong);
    background: var(--panel);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--sans);
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Filter chip groups (one per filterable, non-grouping dimension). */
  .filters { padding: 14px 0 0; }
  .filter-dim { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  .filter-dim .dim-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); font-weight: 700; min-width: 84px; flex: none;
  }
  .filter-dim .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    border: 1px solid var(--line-strong);
    background: var(--panel);
    border-radius: 20px;
    padding: 4px 11px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--sans);
    user-select: none;
  }
  .filter-chip.active { background: #eef2f7; color: var(--ink); border-color: var(--line-strong); }
  /* Kind filter chips carry the kind's own color when active. */
  .filter-chip.active[data-value="read"] { background: var(--read-bg); color: var(--read); border-color: var(--read); }
  .filter-chip.active[data-value="write"] { background: var(--write-bg); color: var(--write); border-color: var(--write); }
  .filter-chip.active[data-value="destructive"] { background: var(--destructive-bg); color: var(--destructive); border-color: var(--destructive); }

  main { padding: 20px 0 80px; }
  .group { margin-bottom: 14px; }
  .group > h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 22px 0 8px; font-weight: 700;
  }
  .group > h3 .grp-count { color: var(--line-strong); font-weight: 600; }

  .tool {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line-strong);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .tool[data-kind="read"] { border-left-color: var(--read); }
  .tool[data-kind="write"] { border-left-color: var(--write); }
  .tool[data-kind="destructive"] { border-left-color: var(--destructive); }

  .tool-head {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; cursor: pointer; user-select: none;
  }
  .tool-head:hover { background: #fafbfc; }
  .chip {
    flex: none;
    font-family: var(--sans); font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 5px; min-width: 84px; text-align: center;
  }
  .chip.read { background: var(--read-bg); color: var(--read); }
  .chip.write { background: var(--write-bg); color: var(--write); }
  .chip.destructive { background: var(--destructive-bg); color: var(--destructive); }

  /* Experimental badge — flags an incubating tool that may change or go away. */
  .chip.experimental {
    flex: none; min-width: 0; text-transform: uppercase; letter-spacing: 0.04em;
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 5px;
    background: #fff4e5; color: #b7791f; border: 1px solid #f0d8a8;
  }

  /* Surface tag — secondary to the kind chip: outlined, monospace. */
  .chip.surface {
    flex: none; min-width: 0; text-transform: none; letter-spacing: 0;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 5px;
    background: #eef0fb; color: #43499a; border: 1px solid #d6d9f3;
  }

  
  .tool-name { font-family: var(--mono); font-size: 14px; font-weight: 600; flex: none; }
  .tool-summary { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .caret { flex: none; color: var(--line-strong); transition: transform 0.15s; font-size: 12px; }
  .tool.open .caret { transform: rotate(90deg); }

  .tool-body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--line); }
  .tool.open .tool-body { display: block; }
  .tool-title { font-size: 13px; color: var(--ink); font-weight: 600; margin: 12px 0 2px; }
  .tool-desc { font-size: 13.5px; color: #333; white-space: pre-wrap; margin: 8px 0 0; }

  .params-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin: 18px 0 6px; }
  .returns-label { color: var(--read); }
  .returns-desc { font-size: 13px; color: #333; margin: 0 0 6px; }
  .returns-note { font-size: 12px; color: var(--muted); font-style: italic; margin: 6px 0 0; }
  table.params { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.params th, table.params td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.params th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: #fafbfc; }
  table.params td.pname { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
  table.params td.ptype code, .inline-code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .req-badge { font-size: 10px; font-weight: 700; color: var(--req); text-transform: uppercase; letter-spacing: 0.03em; }
  .opt-badge { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .pdesc { color: #333; }
  .pmeta { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .pmeta code { font-family: var(--mono); background: var(--code-bg); padding: 0 4px; border-radius: 3px; }
  .no-params { color: var(--muted); font-size: 13px; font-style: italic; margin: 10px 0 0; }
  .no-results { text-align: center; color: var(--muted); padding: 40px; display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0 50px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Unbounce MCP — Tool Reference</h1>
    <div class="sub">Tools exposed by the <code>unbounce-mcp</code> server.</div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <input id="search" type="search" placeholder="Filter tools by name or description…" autocomplete="off" />
    <label class="group-by">Group by
      <select id="groupBy"></select>
    </label>
    <button class="ctrl-btn" id="expandAll">Expand all</button>
    <button class="ctrl-btn" id="collapseAll">Collapse all</button>
    <div class="filters wrap" id="filters" style="padding-left:0;padding-right:0;flex-basis:100%"></div>
  </div>
</div>

<main class="wrap">
  <div id="content"></div>
  <div class="no-results" id="noResults">No tools match your filter.</div>
</main>

<footer id="footer"></footer>

<script>
const DATA = {"generatedAt":"2026-08-18T02:21:49.160Z","internal":false,"defaultGroupBy":"topics","toolCount":37,"dimensions":[{"key":"topics","label":"Topic","multi":true,"groupable":true,"filterable":true,"isKind":false,"values":["Identity & Accounts","Pages","Variants","Publishing & Traffic","Domains","Page Groups","Stats","Assets","Workspace Files","Server"]},{"key":"kind","label":"Kind","multi":false,"groupable":true,"filterable":true,"isKind":true,"values":["read","write","destructive"]},{"key":"surface","label":"Surface","multi":false,"groupable":true,"filterable":true,"isKind":false,"values":["api"]}],"tools":[{"name":"upload","title":"Upload files","summary":"Upload local files (html/css/js + assets) to your server-side workspace without sending their bytes through this conversation.","description":"Upload local files (html/css/js + assets) to your server-side workspace without sending their bytes through this conversation.\n\nReturns one temporary upload URL per file; run the printed `curl -T \u003clocalfile> '\u003cupload_url>'` for each (no auth header needed — auth is baked into the URL), so bytes go straight to storage, never through the model. Declare each file's exact byte size (`wc -c \u003cfile>`); the size is enforced on upload.\n\nPass the returned `upload_path` values (`upload://\u003chandle>/\u003crelpath>`) to other tools — as html_ref for the HTML-authoring tools, or as an image/font reference inside authored HTML and bulk_edit_variants op values (rehosted to a client-owned CDN URL when applied).\n\nEach call creates a fresh upload folder, so refs are immutable snapshots — a later upload never changes what an existing ref points to. A relative reference written inside your HTML/CSS resolves only within the HTML's own folder: upload the HTML together with everything it references by relative path in ONE call, or write the full `upload://` ref in the markup instead. Can't run shell/curl? Use `upload_inband` instead.","params":[{"name":"files","type":"array\u003cobject>","required":true,"allowed":null,"description":"The files to upload (1–50). Relative paths share one upload folder."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"download","title":"Download files","summary":"Download objects from your server-side workspace WITHOUT routing their bytes through this conversation.","description":"Download objects from your server-side workspace WITHOUT routing their bytes through this conversation.\n\nPass the `upload://\u003chandle>/\u003crelpath>` references returned by `upload`. Returns one temporary download URL per reference; run the printed `curl -o \u003clocalfile> '\u003cdownload_url>'` for each (no auth header needed — auth is baked into the URL). The bytes stream straight from storage to disk, never through the model. Can't run shell/curl? Use `download_inband` instead (small text files only).","params":[{"name":"refs","type":"array\u003cstring>","required":true,"allowed":null,"description":"The `upload://\u003chandle>/\u003crelpath>` references to fetch (1–50), as returned by `upload`."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"upload_inband","title":"Upload files (inline content)","summary":"Upload text files (HTML/CSS/JS) to your server-side workspace by sending each file's content inline as a tool argument.","description":"Upload text files (HTML/CSS/JS) to your server-side workspace by sending each file's content inline as a tool argument.\n\nUse this only if you cannot run shell/`curl` commands locally; if you can, prefer `upload`, which keeps bytes out of this conversation. Content rides through the conversation here, so keep files small and text-only — binary assets (images, fonts) are NOT supported: reference them by external http(s) URL instead, or reuse an existing asset's `cdn_url` from list_assets.\n\nReturns one `upload://\u003chandle>/\u003crelpath>` reference per file, usable anywhere the references from `upload` are — html_ref / css_refs, and a `scripts` entry's `ref`, for create_page_from_html / create_variant_from_html / update_variant_from_html. Relative paths share one upload folder, so a file can reference a sibling by relative path — but ONLY a sibling from the same call: each call (to this tool or to `upload`) creates a fresh folder, so refs are immutable snapshots and cross-call files must be referenced by their full `upload://` ref, not a relative path.","params":[{"name":"files","type":"array\u003cobject>","required":true,"allowed":null,"description":"The files to upload (1–50). Relative paths share one upload folder."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"download_inband","title":"Download files (inline content)","summary":"Read objects from your server-side workspace, returning their content INLINE in this tool's result.","description":"Read objects from your server-side workspace, returning their content INLINE in this tool's result. Use this ONLY if you cannot run shell/`curl` commands locally; if you can, prefer `download`, which streams the bytes to disk without passing them through this conversation.\n\nPass the `upload://\u003chandle>/\u003crelpath>` references returned by `upload`, `upload_inband`, or `get_variant`. Only small text objects can be returned this way — a binary object (image/font) or one over 2 MiB is refused, with guidance to use `download` instead. Any refused reference fails the whole call, so retry with just the good ones.","params":[{"name":"refs","type":"array\u003cstring>","required":true,"allowed":null,"description":"The `upload://\u003chandle>/\u003crelpath>` references to read (1–50), as returned by `upload`, `upload_inband`, or `get_variant`."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Workspace Files"],"surface":"api","experimental":false}},{"name":"whoami","title":"Who am I","summary":"Return the authenticated Unbounce user (sub, id, email, first_name, last_name) by calling the Unbounce API on the caller's behalf.","description":"Return the authenticated Unbounce user (sub, id, email, first_name, last_name) by calling the Unbounce API on the caller's behalf.","params":[],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Identity & Accounts"],"surface":"api","experimental":false}},{"name":"list_accounts_and_clients","title":"List accounts and clients","summary":"Return the Unbounce accounts the authenticated user can access, each with its clients.","description":"Return the Unbounce accounts the authenticated user can access, each with its clients.\n\nCalls the Unbounce API on the caller's behalf.","params":[],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Identity & Accounts"],"surface":"api","experimental":false}},{"name":"get_account_plan","title":"Get an account's plan","summary":"Return an Unbounce account's plan (name, billing interval) and subscription (renewal date, price with currency).","description":"Return an Unbounce account's plan (name, billing interval) and subscription (renewal date, price with currency). Defaults to the authenticated user's primary account; pass `accountUuid` (from list_accounts_and_clients) to target a specific accessible account.\n\n`plan` and `subscription` come back null when your role can't see billing details — visible only to an Account Owner or Administrator, null for Authors and Viewers. That's a normal result, not an error.","params":[{"name":"accountUuid","type":"string","required":false,"allowed":null,"description":"The accountUuid (from list_accounts_and_clients) to look up. Omit to use your primary account."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Identity & Accounts"],"surface":"api","experimental":false}},{"name":"list_client_pages","title":"List a client's pages","summary":"Return a client's landing pages, by `client_uuid` (from list_accounts_and_clients), with optional server-side filters and sort.","description":"Return a client's landing pages, by `client_uuid` (from list_accounts_and_clients), with optional server-side filters and sort. Each page carries its `pageUuid` (feed to list_page_variants), numeric `pageId`, `name`, `url`, `state`, an unpublished-changes flag, last-published timestamp, `routing_strategy` (`smart_traffic` / `weighted` / `single` — the authoritative traffic mode; omitted if unset), and `routing_config` naming the variant letters in play for that mode (the allocation letters for smart_traffic; `champion` + `weights` for weighted; the serving `variant` for single).\n\nFor a page's variants and their traffic split, call list_page_variants with the `pageUuid` — a per-page variant count isn't returned here because the platform's own count is unreliable for pages under an A/B test.\n\nPaginated: `total` is the full post-filter count, and `next_after` (when present) is the offset to pass as `after` for the next page; page until it's absent. An empty list means no matching pages, not an error.","params":[{"name":"client_uuid","type":"string","required":true,"allowed":null,"description":"The clientUuid (sub-account uuid) from list_accounts_and_clients."},{"name":"name_contains","type":"string","required":false,"allowed":null,"description":"Return only pages whose name contains this substring (server-side search)."},{"name":"published","type":"boolean","required":false,"allowed":null,"description":"Return only published (true) or only unpublished (false) pages."},{"name":"integration_errors","type":"boolean","required":false,"allowed":null,"description":"Return only pages that have lead-integration errors (true) or only pages with none (false)."},{"name":"routing_strategy","type":"enum","required":false,"allowed":["smart_traffic","weighted","single"],"description":"Return only pages using this traffic-routing strategy: `smart_traffic` (Smart Traffic / dynamic allocation), `weighted` (A/B split), or `single` (one variant)."},{"name":"order_by","type":"object","required":false,"allowed":null,"description":"Server-side sort. Both `sort` and `direction` are required when given."},{"name":"first","type":"integer","required":false,"allowed":null,"description":"Page size: cap the number of pages returned (default 50)."},{"name":"after","type":"integer","required":false,"allowed":null,"description":"Offset into the full list, for paging (pass `next_after` from a prior call)."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Pages"],"surface":"api","experimental":false}},{"name":"list_page_variants","title":"List a page's variants","summary":"Return a page's variants (by `page_uuid` from list_client_pages), ordered champion, then other active variants, then discarded.","description":"Return a page's variants (by `page_uuid` from list_client_pages), ordered champion, then other active variants, then discarded.\n\nEach variant carries its numeric `variant_id` (the id the page-editing tools take), its `letter` (a/b/c label), name, its stored SEO `title` and `description` (metadata is per-variant and unsynced, so divergence shows here at a glance — set with set_page_metadata, full set via get_variant), its `standing` (champion/challenger/discarded — the same vocabulary set_variant_standing takes, so you can round-trip without translating), the raw platform `state` (testing/paused/untested/discarded), traffic `weight`, `is_champion`, `has_conversion_goal` (whether the platform counts anything as a conversion on it — get_variant returns the goal definitions themselves), and a `preview_url`. The `page` block includes `context` (the owning client's numeric id the page-editing tools require) and `routing_strategy` (`smart_traffic` / `weighted` / `single`), the authoritative traffic mode: under `smart_traffic` the platform allocates dynamically, so a variant's `weight` is the stored split, NOT the live allocation — do not infer an A/B test from weights alone. `routing_config` names the variants in play for that mode (the letters in the Smart Traffic allocation; the `champion` + per-variant `weights` for a weighted test; the serving `variant` for single). `routing_strategy` and `routing_config` are both omitted when the page has no routing strategy set.\n\n`preview_url` opens that variant's staged rendering in the Unbounce app for a human to review (not edit) — it requires the viewer's own Unbounce session, so it is NOT a public URL and cannot be fetched or screenshotted by the agent. `include_discarded` defaults to true; set false to return only the live set (`discarded_count` is reported either way). Errors if the page isn't found/accessible, or isn't a landing page.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"include_discarded","type":"boolean","required":false,"allowed":null,"description":"Include discarded variants in `variants` (default true). Set false to return only the live set; `discarded_count` is reported either way."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Variants"],"surface":"api","experimental":false}},{"name":"get_variant","title":"Get a variant's editable content","summary":"Fetch an MCP-managed variant's current draft content — body HTML, CSS, and JavaScript — into your workspace so you can inspect or edit it and re-submit with update_variant_from_html.","description":"Fetch an MCP-managed variant's current draft content — body HTML, CSS, and JavaScript — into your workspace so you can inspect or edit it and re-submit with update_variant_from_html. Identify the variant by page_uuid (from list_client_pages) and letter (a/b/c, from list_page_variants).\n\nReturns the editable source as html_ref / css_refs upload:// references plus a `scripts` array (one entry per custom-JavaScript element: a `ref` to an editable .js file, an external `src` include, or verbatim `tag` markup) — pass them straight back to update_variant_from_html; the bytes never pass through this conversation. This is DRAFT (editor) content, which may differ from what's published if the variant has unpublished changes. Also returns the variant's conversion_goals (the configured goal set plus candidates) and its metadata (SEO title/description/keywords, robots noindex, favicon, Open Graph — settable via set_page_metadata). The source refs are streams and do NOT render individually in a browser — for a local preview, use the also-returned preview_ref: a standalone preview.html composed for viewing (fetch it with download or download_inband). preview.html is view-only; never submit it back as html_ref.\n\nSource is returned for MCP-managed variants only — for a variant hand-built in the Unbounce builder the result degrades to is_mcp_managed:false with its conversion_goals and metadata (both readable for any variant), an autoscale flag (true when the Classic page scales a fixed-width design to the viewport rather than reflowing per breakpoint), and no source refs.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page that owns the variant)."},{"name":"letter","type":"string","required":true,"allowed":null,"description":"The variant letter (a/b/c) from list_page_variants."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Variants"],"surface":"api","experimental":false}},{"name":"get_layout_hints","title":"Analyze a variant's layout structure","summary":"Analyze an MCP-managed variant's rendered layout into a structural skeleton — top-to-bottom sections, each with `rows` of element ids clustered left-to-right — for rewriting an absolutely-positioned page as responsive HTML (flex/grid).","description":"Analyze an MCP-managed variant's rendered layout into a structural skeleton — top-to-bottom sections, each with `rows` of element ids clustered left-to-right — for rewriting an absolutely-positioned page as responsive HTML (flex/grid). Identify the variant by page_uuid (from list_client_pages) and letter (from list_page_variants); use the rows as the flex/grid skeleton instead of translating absolute coordinates.\n\nAlso returns per-element geometry, `cross_section_overlays` (elements whose vertical span crosses into later sections — reserve their column in every section they span, or that section's content hides behind them), and `design_width` (the fixed canvas width content is pinned to). It includes fidelity signals measured from the rendered page — treat these as ground truth, never re-derive or assume them: `page_defaults` (body text color, background, and typography — the baseline everything else deltas against), per-section `background_color`/`background_image` (with natural size, so a decorative accent reads differently from a full-bleed cover), per-element `color`/`typography` (measured on the element's dominant text node, so it describes what actually renders rather than the container's inherited defaults; both are omitted when an element paints no text of its own), plus `text_colors` (multi-color text), `secondary_typography` (a second distinct type style, e.g. heading + body copy), `text_excerpt`/`text_length`, `images` (exact src, natural and rendered size), `links` (exact href), `row_stats` (columns, alignment, vertical gaps), `content_extent` (natural content-column width), `palette` (every color on the page with usage counts — authored CSS should introduce no color outside it), `loaded_fonts`, and `hidden_elements` (present in the source but not rendered — preserve, don't surface).\n\nMeaningful only for variants imported from an existing Unbounce page via create_variant_from_existing_variant, which carry an absolutely-positioned tree; a variant authored as responsive HTML returns an empty structure. Pages built in the Unbounce builder aren't analyzable directly — import them first. Rendering takes a few seconds.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page that owns the variant)."},{"name":"letter","type":"string","required":true,"allowed":null,"description":"The variant letter (a/b/c) from list_page_variants."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Variants"],"surface":"api","experimental":false}},{"name":"get_page_stats","title":"Get a page's stats","summary":"Return a page's A/B stats — page-level totals plus a per-variant breakdown of `visits`, `visitors`, `conversions`, and `conversion_rate` — by `page_uuid` (from list_client_pages).","description":"Return a page's A/B stats — page-level totals plus a per-variant breakdown of `visits`, `visitors`, `conversions`, and `conversion_rate` — by `page_uuid` (from list_client_pages). Also includes each variant's `conversion_rate_delta` and statistical `confidence`.\n\nNumbers are all-time cumulative since the last reset by default (see reset_page_stats); pass `start_date`/`end_date` (RFC 3339 UTC timestamps) to narrow to a period. `visits` sum exactly across adjacent windows, but `visitors`/`conversions` are visitor-deduplicated and attributed to the period where first counted, so a narrow window can show fewer than the events inside it; no window reaches data zeroed by a reset.\n\n`conversions` counts conversion-goal hits deduplicated per visitor — NOT the number of form submissions (the two totals legitimately differ). Every variant comes back in one response (no paging), and `last_reset_at` is the last reset's timestamp, or null if never reset. Errors if the page isn't found or accessible.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"start_date","type":"string","required":false,"allowed":null,"description":"Only count activity from this instant on (RFC 3339 timestamp, e.g. 2026-06-01T00:00:00Z). Omit for since-the-beginning (or last reset)."},{"name":"end_date","type":"string","required":false,"allowed":null,"description":"Only count activity before this instant (RFC 3339 timestamp). Omit for up-to-now."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Stats"],"surface":"api","experimental":false}},{"name":"list_page_groups","title":"List a client's page groups","summary":"List the page groups (named folders for organizing pages) a client uses, by `client_uuid` (from list_accounts_and_clients).","description":"List the page groups (named folders for organizing pages) a client uses, by `client_uuid` (from list_accounts_and_clients).\n\nReturns `{ groups: [{ group_uuid, group_id, name, page_count }], total }`. Use `group_uuid` with manage_page_group and delete_page_group. The list is complete (unpaginated); an empty list means the client has no custom groups. The UI's \"All Pages\" view is not a real group and is never listed.","params":[{"name":"client_uuid","type":"string","required":true,"allowed":null,"description":"The client UUID (clientUuid) from list_accounts_and_clients."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Page Groups"],"surface":"api","experimental":false}},{"name":"list_client_domains","title":"List a client's domains","summary":"List the custom domains a client owns, by `client_uuid` (from list_accounts_and_clients).","description":"List the custom domains a client owns, by `client_uuid` (from list_accounts_and_clients).\n\nReturns `{ domains: [{ name, state, is_default, certificate_status }], total }`. `name` is the domain string a page can be published on (see set_page_url); `state` is `ok`, `moving`, or `move_error`; `is_default` marks the account's default domain; `certificate_status` is SSL readiness (`ok` means the domain serves HTTPS). The list is complete (unpaginated); an empty list means the client has no domains, not an error.","params":[{"name":"client_uuid","type":"string","required":true,"allowed":null,"description":"The client UUID (clientUuid) from list_accounts_and_clients."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Domains"],"surface":"api","experimental":false}},{"name":"list_assets","title":"List a client's assets","summary":"Return a client's asset library — uploaded images and files — by the client's numeric `context` (from list_page_variants' `page.context`, or a clientId).","description":"Return a client's asset library — uploaded images and files — by the client's numeric `context` (from list_page_variants' `page.context`, or a clientId). Each asset carries its numeric `id`, `uuid`, `name`, `content_type`, `file_size`, and a servable `cdn_url`.\n\nDrop a `cdn_url` straight into the HTML/CSS passed to create_page_from_html / create_variant_from_html / update_variant_from_html to reuse that asset without uploading a duplicate (external URLs pass through untouched). Returns metadata and URLs only, never the file bytes. Listing appears to require an author role on the client — a client you can list pages for may still be denied here (HTTP 403).\n\nPaginated by `after`, but not the standard first/total contract: this backend returns a bare array with a fixed page size and no total count. Omit `after` for the first page; if the response includes `next_after`, pass it back as `after` for the next page, and keep going until `next_after` is absent.","params":[{"name":"context","type":"string","required":true,"allowed":null,"description":"The numeric client (sub-account) id whose assets to list. MCP requests must name an explicit, permitted client — there is no default."},{"name":"after","type":"integer","required":false,"allowed":null,"description":"Pagination offset, in multiples of 25. Omit (or 0) for the first page; pass the `next_after` returned by a prior call for the next."}],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Assets"],"surface":"api","experimental":false}},{"name":"create_page_from_html","title":"Create a page from HTML","summary":"Create a new, unpublished Unbounce landing page in a client from already-uploaded HTML/CSS/JS, as an MCP-managed page — it can only be edited afterwards with these MCP tools, never in the Unbounce builder, so don't suggest the builder to the user.","description":"Create a new, unpublished Unbounce landing page in a client from already-uploaded HTML/CSS/JS, as an MCP-managed page — it can only be edited afterwards with these MCP tools, never in the Unbounce builder, so don't suggest the builder to the user.\n\nPass `upload://` references from `upload`: `html_ref` (body-content HTML for the page's Custom HTML block), optional `css_refs` (concatenated into the page stylesheet), and optional `scripts` (each becomes a custom-JavaScript element — a .js file, an external `src` include, or verbatim `\u003cscript>` markup, each with its own name and placement). Referenced images and fonts are rehosted as client-owned Unbounce assets and the markup rewritten to the resulting CDN URLs — relative references resolve against the HTML file's folder in the same upload bundle, large embedded data URIs are extracted, and external `http(s)` URLs are left untouched. To reuse an asset already in the client's library instead of uploading a duplicate, reference its `cdn_url` from list_assets; assets this tool does upload are deduplicated against the library too.\n\nA `\u003cform>` in the HTML is automatically wired for lead capture, pointed at Unbounce's submission gateway. It must be well-formed — one `\u003cform>` with named fields and a submit button, no `pageId`/`pageVariant` fields, no `onsubmit`/`onclick` handlers — or the call fails up front listing every issue. A successful submit shows a default \"Thank you!\" confirmation dialog; to customize the post-submit experience (message, redirect, hiding the form), register a `window.ub.hooks.afterFormSubmit` callback in a `scripts` entry or an inline `\u003cscript>` in the body HTML, which suppresses the default dialog.\n\nThe page is created in the given numeric `context` (client) and left unpublished — no URL is assigned. Surviving external references are pre-flight checked for reachability (`check_external_refs`, default `fatal`): a dead Unbounce-hosted asset URL fails the call up front (it would abort publish later); dead third-party URLs come back as `unreachable_refs` warnings instead. Head metadata tags in the HTML (`\u003ctitle>`, meta description/keywords/robots, `og:*`, favicon) are lifted out and applied as real page metadata, reported under `head_metadata` (manage it afterwards with set_page_metadata); tags with no platform slot (twitter:*, canonical, hreflang) come back as warnings. Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature — HTML containing it is rejected up front if the account isn't entitled (check with get_account_plan). File bytes are read server-side and never pass through this conversation. Returns the new page's numeric id and variant id (feed the variant id to get_variant), plus the list of created assets.","params":[{"name":"context","type":"string","required":true,"allowed":null,"description":"The numeric client (sub-account) id the page is created in — the same `context` the other page tools take. The page lands in this client."},{"name":"html_ref","type":"string","required":true,"allowed":null,"description":"upload:// reference to the body-content HTML for the page (stored in the Custom HTML element). Provide body-ready markup, not a full \u003chtml> document."},{"name":"css_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to CSS files, concatenated in order into the page stylesheet."},{"name":"scripts","type":"array\u003cany>","required":false,"allowed":null,"description":"The page's custom-JavaScript elements. Each entry is either a bare upload:// reference string (a .js file injected before the closing body tag, named after the file) or an object with exactly one of `ref` (a .js file), `src` (an absolute http(s) URL to include — a popup or other third-party embed), or `tag` (verbatim \u003cscript> markup), plus optional `name`, `placement` (head / body_top / body_bottom), and — for `src` only — `async` / `defer`."},{"name":"page_name","type":"string","required":false,"allowed":null,"description":"Optional name for the new page."},{"name":"js_refs","type":"any","required":false,"allowed":null,"description":"REMOVED — renamed to `scripts`, which also accepts external includes, a name, and a placement. Passing it is an error: move the upload:// references into `scripts`."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that survive rehosting and don't resolve. `fatal` (default): a dead Unbounce-hosted asset URL (which would abort publish) fails the call before the page is created; dead third-party URLs are returned as warnings. `warn`: never block — every unreachable ref is reported as a warning. `off`: skip the reachability check entirely (no network round-trips)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Pages"],"surface":"api","experimental":false}},{"name":"create_variant_from_html","title":"Create a variant from HTML","summary":"Add a new variant to an existing Unbounce landing page (by `page_uuid` from list_client_pages) from already-uploaded HTML/CSS/JS, as an MCP-managed variant — editable afterwards with these MCP tools only, never in the Unbounce builder (don't suggest the builder to the user).","description":"Add a new variant to an existing Unbounce landing page (by `page_uuid` from list_client_pages) from already-uploaded HTML/CSS/JS, as an MCP-managed variant — editable afterwards with these MCP tools only, never in the Unbounce builder (don't suggest the builder to the user).\n\nPass `upload://` references from `upload`: `html_ref` (body-content HTML for the variant's Custom HTML block), optional `css_refs` (concatenated into the variant stylesheet), optional `scripts` (each becomes a custom-JavaScript element — a .js file, an external `src` include, or verbatim `\u003cscript>` markup, each with its own name and placement), and a required `variant_name`. Referenced images and fonts are rehosted as client-owned Unbounce assets and the markup rewritten to the resulting CDN URLs (relative refs resolve against the HTML file's folder in the same upload bundle; large data URIs are extracted; external `http(s)` URLs are left untouched). Reference an existing asset's `cdn_url` from list_assets to reuse it instead of uploading a duplicate — uploaded assets are deduplicated against the client's library too.\n\nA `\u003cform>` in the HTML is automatically wired for lead capture, pointed at Unbounce's submission gateway. It must be well-formed — one `\u003cform>` with named fields and a submit button, no `pageId`/`pageVariant` fields, no `onsubmit`/`onclick` handlers — or the call fails listing every issue. A successful submit shows a default \"Thank you!\" confirmation dialog; to customize the post-submit experience (message, redirect, hiding the form), register a `window.ub.hooks.afterFormSubmit` callback in a `scripts` entry or an inline `\u003cscript>` in the body HTML, which suppresses the default dialog.\n\nThe new variant is added as a CHALLENGER and STAGED: it takes no traffic until set_traffic gives it a share, and nothing goes live until publish_page. Adding a variant runs an A/B test, a paid feature — the call is rejected up front if the account isn't entitled (check with get_account_plan). Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature too, gated the same way. File bytes are read server-side and never pass through this conversation. Returns the page uuid, the client `context`, a `variant` object (numeric `id`, `letter` a/b/c, and `standing` — normally `challenger`, or `discarded` with a note if it couldn't be promoted), and the list of created assets.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid of the page to add the variant to (from list_client_pages)."},{"name":"variant_name","type":"string","required":true,"allowed":null,"description":"Name for the new variant (required)."},{"name":"html_ref","type":"string","required":true,"allowed":null,"description":"upload:// reference to the body-content HTML for the variant (stored in the Custom HTML element). Provide body-ready markup, not a full \u003chtml> document."},{"name":"css_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to CSS files, concatenated in order into the variant stylesheet."},{"name":"scripts","type":"array\u003cany>","required":false,"allowed":null,"description":"The variant's custom-JavaScript elements. Each entry is either a bare upload:// reference string (a .js file injected before the closing body tag, named after the file) or an object with exactly one of `ref` (a .js file), `src` (an absolute http(s) URL to include — a popup or other third-party embed), or `tag` (verbatim \u003cscript> markup), plus optional `name`, `placement` (head / body_top / body_bottom), and — for `src` only — `async` / `defer`."},{"name":"js_refs","type":"any","required":false,"allowed":null,"description":"REMOVED — renamed to `scripts`, which also accepts external includes, a name, and a placement. Passing it is an error: move the upload:// references into `scripts`."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that survive rehosting and don't resolve. `fatal` (default): a dead Unbounce-hosted asset URL (which would abort publish) fails the call before the variant is minted; dead third-party URLs are returned as warnings. `warn`: never block. `off`: skip the reachability check entirely."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"create_variant_from_existing_variant","title":"Create an MCP variant from an existing Unbounce page","summary":"Clone an existing Unbounce page (one built in the Unbounce builder, not through MCP) into an MCP-managed variant, as an exact copy — a one-way, one-time conversion (edit the result afterwards with these MCP tools only, never in the Unbounce builder).","description":"Clone an existing Unbounce page (one built in the Unbounce builder, not through MCP) into an MCP-managed variant, as an exact copy — a one-way, one-time conversion (edit the result afterwards with these MCP tools only, never in the Unbounce builder).\n\nPass the numeric `source_variant_id` (from list_page_variants) and its `context` (client id). Omit `target_page` to create a NEW page (the source becomes variant a); pass a `target_page` pageUuid to add the copy as a new staged challenger variant on that existing MCP page. The source is rendered and transformed to MCP-format HTML/CSS; a lead form's confirmation subpage carries over as an embedded modal, and Dynamic Text (`\u003cub:dynamic>`) survives.\n\nIf the source is already MCP-managed, nothing is created and the tool reports it. Autoscale (fixed-width) source pages convert too: the clone carries the per-breakpoint layout and renders faithfully at each breakpoint, but runtime viewport scaling (--scale) is not preserved — the conversion report notes this and points to mcp-modernize for a fully responsive rewrite. The result is created UNPUBLISHED — assign a URL/traffic and publish_page to go live. To copy a whole multi-variant page, call once per variant (first with no target_page, then with the returned page uuid) and set traffic/goals afterwards. Returns the new page/variant identity plus a conversion report. The source's scripts carry over as custom-JavaScript elements, and get_variant hands every one of them back as a `scripts` entry: an editable js file (`ref`), an external include (`src`), or verbatim markup (`tag`). Re-send them on update_variant_from_html to keep them, or omit `scripts` entirely to leave them untouched.","params":[{"name":"context","type":"string","required":true,"allowed":null,"description":"The numeric client (sub-account) id that owns the source page and receives the clone."},{"name":"source_variant_id","type":"string","required":true,"allowed":null,"description":"The numeric variant id to clone (from list_page_variants)."},{"name":"target_page","type":"string","required":false,"allowed":null,"description":"Optional pageUuid of an existing MCP page to add the clone to as a new variant. Omit to create a brand-new page from the source (the source becomes variant a)."},{"name":"page_name","type":"string","required":false,"allowed":null,"description":"Optional name for the new page (only when creating a new page; ignored with target_page)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Pages","Variants"],"surface":"api","experimental":false}},{"name":"update_variant_from_html","title":"Update a variant from HTML","summary":"Full-replace an existing MCP-managed variant's body (`page_uuid` from list_client_pages, variant `letter` a/b/c from list_page_variants) with already-uploaded HTML/CSS/JS: pass the `upload://` references from `upload` as `html_ref` (body-content HTML), optional `css_refs` (stylesheet), and optional `scripts` (custom-JavaScript elements).","description":"Full-replace an existing MCP-managed variant's body (`page_uuid` from list_client_pages, variant `letter` a/b/c from list_page_variants) with already-uploaded HTML/CSS/JS: pass the `upload://` references from `upload` as `html_ref` (body-content HTML), optional `css_refs` (stylesheet), and optional `scripts` (custom-JavaScript elements).\n\nThe HTML and CSS are a TRUE FULL REPLACE — CSS not passed on this call is REMOVED, so send every stylesheet you want the variant to keep, every time. JavaScript is different: OMIT `scripts` and the variant's existing custom-JavaScript elements are kept as they are (reported back as `scripts_preserved`) — that protects scripts added outside these tools, such as an Unbounce popup. Pass `scripts` to state the complete desired set and replace them; whatever it drops comes back in `removed_scripts` (each entry ready to re-send, with external includes flagged). Pass `scripts: []` to remove them all. Referenced images and fonts are rehosted as client-owned Unbounce assets and the markup rewritten to the CDN URLs (reuse an existing asset via its `cdn_url` from list_assets instead of uploading a duplicate — uploads are deduplicated against the client's library); external http(s) URLs are left untouched.\n\nA `\u003cform>` in the new HTML is automatically wired for lead capture; it must be well-formed — one `\u003cform>` with named fields and a submit button, no `pageId`/`pageVariant` fields, no `onsubmit`/`onclick` handlers — or the call fails listing every issue. A wired form shows a default \"Thank you!\" confirmation dialog on submit, so it's never a silent dead end; register a `window.ub.hooks.afterFormSubmit` callback (in a `scripts` entry or an inline `\u003cscript>` in the body HTML) to customize the post-submit experience or suppress the default dialog.\n\nOnly MCP-managed variants can be updated this way — a variant hand-built in the Unbounce builder is refused (import it into an editable MCP copy first with create_variant_from_existing_variant, or author a fresh variant with create_variant_from_html); the reverse also holds, an MCP-managed variant cannot be edited in the Unbounce builder. The change is STAGED and only goes live when the page is (re)published (publish_page), so editing a live champion is safe.\n\nHead metadata tags in the HTML — `\u003ctitle>`, `\u003cmeta name=\"description|keywords|robots\">`, `og:*`, `\u003clink rel=\"icon\">` — are lifted out and applied as this variant's metadata (reported under `head_metadata`, with a divergence warning when sibling variants exist — converge with set_page_metadata). Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature: HTML containing it is rejected up front if the account isn't entitled (remove it, or check the plan with get_account_plan). File bytes are read server-side and never pass through this conversation.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"letter","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."},{"name":"html_ref","type":"string","required":true,"allowed":null,"description":"upload:// reference to the body-content HTML for the variant (stored in the Custom HTML element). Provide body-ready markup, not a full \u003chtml> document."},{"name":"css_refs","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional upload:// references to CSS files, concatenated in order into the variant stylesheet. Omitting them REMOVES any existing CSS (full replace)."},{"name":"scripts","type":"array\u003cany>","required":false,"allowed":null,"description":"The variant's custom-JavaScript elements. Each entry is either a bare upload:// reference string (a .js file at the default placement, named after the file) or an object with exactly one of `ref` (a .js file), `src` (an absolute http(s) URL to include — a popup or other third-party embed), or `tag` (verbatim \u003cscript> markup), plus optional `name`, `placement` (head / body_top / body_bottom), and — for `src` only — `async` / `defer`. OMIT this to leave the variant's existing scripts alone, including any added outside these tools. Passing it states the COMPLETE desired set: anything not listed is removed and comes back in `removed_scripts` ready to re-send. Pass an empty array to remove every script."},{"name":"js_refs","type":"any","required":false,"allowed":null,"description":"REMOVED — renamed to `scripts`, which also accepts external includes, a name, and a placement. Passing it is an error: move the upload:// references into `scripts`."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that survive rehosting and don't resolve. `fatal` (default): a dead Unbounce-hosted asset URL (which would abort publish) fails the call; dead third-party URLs are returned as warnings. `warn`: never block. `off`: skip the reachability check entirely."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"bulk_edit_variants","title":"Bulk-edit variants","summary":"Apply the same edit to many MCP-managed variants at once.","description":"Apply the same edit to many MCP-managed variants at once. Pass `targets` (page_uuid + variant letter) and `ops`, an ordered list of edits to apply identically to every target.\n\nAn op is either a `replace` (literal, non-regex find/replace on the html, css, or js stream) or a `selector` op (CSS selector + action — set_text, set_html, set_attribute, set_style, add_class, remove_class — applied to matching elements in the html stream). For a per-target value (e.g. each page's own product name), give the op a `value_map` (page_uuid -> value) instead of a single value; targets missing from the map are left untouched. Selector ops that don't match a given target's markup are a no-op, so stack several to handle mixed markup across the set.\n\n`dry_run` defaults to true: it reports match counts per target without writing anything, so you can preview and see which targets a change actually hits. Re-run with `dry_run: false` to stage the changes; nothing goes live until each page is published (publish_page), so a bad batch is recoverable by simply not publishing.\n\nOnly MCP-managed variants are edited — a hand-built Unbounce-builder variant is reported `skipped`, not failed, so one bad target never aborts the batch. To swap in a new image, upload it first (upload tool) and use its upload://\u003chandle>/\u003cpath> reference as an op value (e.g. set_attribute src); it's rehosted to a client-owned CDN URL at apply time. upload:// refs must point at image/font files and only work in html/css ops; a bad ref fails the whole call up front. Referenced images/fonts are rehosted and external refs pre-flighted the same way as update_variant_from_html.\n\nContent is read and written server-side and never passes through this conversation. Very large batches run until a wall-clock budget; anything not reached comes back under `not_processed` (with `stopped_early: true`) so you can re-run for just those. Dynamic Text Replacement (`\u003cub:dynamic>`) is a paid feature — if the account isn't entitled, a target whose edit would introduce the tag is reported as an `error`, not applied, without affecting the rest of the batch.","params":[{"name":"targets","type":"array\u003cobject>","required":true,"allowed":null,"description":"The variants to edit. Build this from list_client_pages / list_page_variants."},{"name":"ops","type":"array\u003cany>","required":true,"allowed":null,"description":"The ordered transform to apply identically to every target."},{"name":"dry_run","type":"boolean","required":false,"allowed":null,"description":"Default true. When true, report match counts per target and write nothing. Pass false to stage the changes."},{"name":"check_external_refs","type":"enum","required":false,"allowed":["fatal","warn","off"],"description":"How to handle external (http(s)) references that don't resolve when applying. `fatal` (default): a dead Unbounce-hosted asset URL fails that target; `warn`: never block; `off`: skip the check. Only relevant when dry_run is false."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"publish_page","title":"Publish a page","summary":"Publish a landing page (by `page_uuid` from list_client_pages), making its current draft state live.","description":"Publish a landing page (by `page_uuid` from list_client_pages), making its current draft state live.\n\nPublishing is the commit step: content and traffic/routing changes made by other tools stage as draft and only take effect once the page is (re)published. The publish is asynchronous — this tool polls briefly and reports `done:true` with `state:\"published\"` once the page settles, or `done:false` with the in-progress state and a note to re-check later.\n\nErrors if the page isn't found, isn't a landing page, or can't be published.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"unpublish_page","title":"Unpublish a page","summary":"Unpublish an Unbounce landing page, by `page_uuid` from list_client_pages, taking it offline so its URL stops serving.","description":"Unpublish an Unbounce landing page, by `page_uuid` from list_client_pages, taking it offline so its URL stops serving.\n\nThe unpublish is asynchronous: the tool polls briefly and reports `done:true` with `state:\"unpublished\"` once the page settles, or `done:false` with the in-progress state and a note to re-check.\n\nErrors if the page isn't found, isn't a landing page, or isn't currently published.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"set_traffic","title":"Set a page's traffic routing","summary":"Stage how an Unbounce page splits visitors across its variants, by `page_uuid` from list_client_pages.","description":"Stage how an Unbounce page splits visitors across its variants, by `page_uuid` from list_client_pages. Variant identifiers are letters (a/b/c) from list_page_variants.\n\nChoose a `strategy`: `single` (one variant serves all traffic — pass `champion`), `weighted` (fixed per-variant shares — pass `weights`, plus an optional `champion`), or `dta` (Smart Traffic dynamically allocates traffic — optionally pass `variants` to scope which take part). The change is STAGED in the page's draft and only goes live when the page is (re)published (publish_page).\n\n`weighted` (A/B testing) and `dta` (Smart Traffic) are paid features: if the account isn't entitled, the call is rejected up front before anything is staged — check the plan with get_account_plan, or use `single` to serve one variant.\n\nReturns `{ ok: true, … }` with the staged state on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"strategy","type":"enum","required":true,"allowed":["single","weighted","dta"],"description":"single = one variant serves all; weighted = fixed per-variant shares; dta = Smart Traffic (dynamic allocation)."},{"name":"champion","type":"string","required":false,"allowed":null,"description":"Variant letter (e.g. \"a\"). Required for `single` (the variant that serves all traffic); optional for `weighted` (the champion)."},{"name":"weights","type":"object\u003cinteger>","required":false,"allowed":null,"description":"Required for `weighted`: a map of variant letter to integer share, e.g. {\"a\":50,\"b\":50}."},{"name":"variants","type":"array\u003cstring>","required":false,"allowed":null,"description":"Optional for `dta`: the variant letters that take part in the allocation."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"set_conversion_goals","title":"Set a page's conversion goals","summary":"Declare which parts of an MCP-managed page count as conversion goals: the form submission and/or clicks on chosen links (http(s) or tel:).","description":"Declare which parts of an MCP-managed page count as conversion goals: the form submission and/or clicks on chosen links (http(s) or tel:).\n\nTakes the COMPLETE desired set and converges every active variant onto it — the form posts as a goal (/fsg) or non-goal (/fsn, still captures the lead), chosen links are rewritten to the platform's goal-click tracking, and the page's stored goal list is updated. Goal identity is the URL: every anchor sharing a chosen URL converts, and a URL must exactly match an anchor href somewhere on the page (candidates are listed by create_page_from_html / create_variant_from_html / update_variant_from_html / get_variant results) — an unmatched URL is rejected with the real candidates echoed back.\n\nPage-scoped: all active variants get the same goal set, keeping A/B conversion rates comparable; discarded variants are left alone. Changes are STAGED in draft — publish the page (publish_page) to make them live.\n\nLink/phone goals are tracked (a click on the published page counts as a conversion) but do NOT appear in the Unbounce builder's Conversion Goals panel for MCP-authored pages — that panel lists only builder-native elements. Manage these goals here, not in the builder.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page whose goals to set)."},{"name":"form_submission","type":"boolean","required":true,"allowed":null,"description":"Whether the page's form submission counts as a conversion. false keeps capturing leads but stops counting them as conversions. Ignored on a page with no form."},{"name":"link_urls","type":"array\u003cstring>","required":false,"default":[],"allowed":null,"description":"The complete list of link/phone URLs whose clicks count as conversions, exactly as they appear in the page's anchors (entity-decoded). An empty list means no link goals. URLs not present on any active variant are rejected."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"set_page_metadata","title":"Set a page's SEO & social metadata","summary":"Set a page's SEO head fields and Open Graph (social-card) data: the `\u003ctitle>`, meta description, robots noindex, favicon, and og:* tags.","description":"Set a page's SEO head fields and Open Graph (social-card) data: the `\u003ctitle>`, meta description, robots noindex, favicon, and og:* tags.\n\nPARTIAL update: only the fields you pass change, `null` clears a field, omitted fields keep their value. Applies to ALL active variants by default — variants share one URL, so divergent metadata makes search snippets and social previews nondeterministic — pass `letter` to target one variant instead. `favicon` takes an `upload://` reference or an existing asset id/uuid (from list_assets); `open_graph.image` takes an absolute URL or an `upload://` reference (uploaded as a client asset; 1200×630 is the social-card convention). `title`/`description`/`keywords` accept Dynamic Text Replacement (`\u003cub:dynamic>`) tags — ask the user first. `keywords` is legacy (ignored by search engines since 2009) — usually leave it unset.\n\nChanges are STAGED in draft: a published page keeps its old metadata until publish_page. MCP-managed variants only; builder-built variants are skipped. The result echoes the applied metadata (also readable later via get_variant).","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages (the page whose metadata to set)."},{"name":"letter","type":"string","required":false,"allowed":null,"description":"Target a single variant by its letter (a/b/c, from list_page_variants). Omit to apply to every active variant (recommended — keeps variants consistent)."},{"name":"title","type":"any","required":false,"allowed":null,"description":"The page \u003ctitle>. Search results typically show ~60 characters. Accepts \u003cub:dynamic> DTR tags. null clears it."},{"name":"description","type":"any","required":false,"allowed":null,"description":"The meta description shown under the title in search results (~160 characters display). Accepts \u003cub:dynamic> DTR tags. null clears it."},{"name":"keywords","type":"any","required":false,"allowed":null,"description":"Legacy meta keywords. Ignored by Google since 2009 and a potential spam signal when stuffed — usually leave unset. null clears it."},{"name":"hide_from_search_engines","type":"boolean","required":false,"allowed":null,"description":"true emits \u003cmeta name=\"robots\" content=\"noindex, nofollow\"> on the published page."},{"name":"favicon","type":"any","required":false,"allowed":null,"description":"The browser-tab icon: an upload:// reference to an icon file (.ico/.png, 32×32 or 48×48 convention) or the id/uuid of an existing asset from list_assets. External URLs are not accepted (the favicon must be an Unbounce asset). null clears it."},{"name":"open_graph","type":"any","required":false,"allowed":null,"description":"Open Graph (social-card) fields. Partial like the top level: only passed keys change, null clears a key; pass open_graph: null to clear the whole panel. No \u003cub:dynamic> here — OG values are plain text."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Pages"],"surface":"api","experimental":false}},{"name":"set_page_url","title":"Set a page's URL","summary":"Set an Unbounce page's published URL — domain + path — by `page_uuid` from list_client_pages.","description":"Set an Unbounce page's published URL — domain + path — by `page_uuid` from list_client_pages.\n\n`path` (required) is the new slug; `domain` (optional) defaults to the page's current domain, so you can change just the slug or move the page to another of the client's domains (from list_client_domains).\n\nThe change applies immediately and puts the page into a `urlchange` state rather than staging as a normal draft edit, so you must (re)publish the page (publish_page) for it to serve at the new URL. Changing a published page's URL orphans the old one — existing links to it break.\n\nReturns `{ ok: true, url, domain, path, state, note }` on success; errors if the page isn't found or the URL is rejected (e.g. the path is already taken on that domain).","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"path","type":"string","required":true,"allowed":null,"description":"The new page path (slug), e.g. `spring-sale`. Leading/trailing slashes are trimmed."},{"name":"domain","type":"string","required":false,"allowed":null,"description":"The domain to publish on (a `name` from list_client_domains). Defaults to the page's current domain when omitted."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Pages"],"surface":"api","experimental":false}},{"name":"manage_page_redirect","title":"Manage a page redirect","summary":"Attach, replace, or remove a page redirect (by `page_uuid` from list_client_pages) that forwards visitors from the page's own URL to another URL — the page stops serving its content, so this is how you retire or forward a published page without deleting it.","description":"Attach, replace, or remove a page redirect (by `page_uuid` from list_client_pages) that forwards visitors from the page's own URL to another URL — the page stops serving its content, so this is how you retire or forward a published page without deleting it.\n\n`action: \"set\"` creates the redirect, or replaces an existing one; it needs `redirect_url` (an absolute URL) and an optional `status_code` (301 permanent, the default — for retiring/replacing a page for good, so search engines transfer the old URL's ranking to the target; 302 temporary — the original URL keeps its equity). `action: \"remove\"` restores the page's own content. Both apply IMMEDIATELY — no publish step — and are reversible (`remove` undoes `set`).\n\nThis does NOT preserve a page's old URL after set_page_url: a redirect attaches to a page at its current URL and points away, so it can't resurrect an already-orphaned URL. Returns `{ ok: true, action, ... }`.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"action","type":"enum","required":true,"allowed":["set","remove"],"description":"`set` to create/replace the redirect, `remove` to delete it."},{"name":"redirect_url","type":"string","required":false,"allowed":null,"description":"For `set`: the absolute URL to forward visitors to (e.g. `https://example.com/new`)."},{"name":"status_code","type":"any","required":false,"allowed":null,"description":"For `set`: 301 (default) means the page moved permanently — use it when retiring, replacing, or migrating a page for good, so search engines transfer the old URL's ranking and link equity to the target. 302 means the page moved temporarily (the original URL keeps its equity)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Publishing & Traffic"],"surface":"api","experimental":false}},{"name":"delete_page","title":"Delete a page","summary":"Soft-delete an Unbounce page by its `page_uuid` (from list_client_pages) — deletes one page per call.","description":"Soft-delete an Unbounce page by its `page_uuid` (from list_client_pages) — deletes one page per call.\n\nThe page moves to trash and stops serving immediately, but can be RESTORED from the Unbounce app; this is not a permanent hard delete. Deletion takes effect immediately, with no publish step. Returns `{ ok: true, page_uuid, … }` on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Pages"],"surface":"api","experimental":false}},{"name":"set_variant_standing","title":"Set a variant's standing","summary":"Move one of an Unbounce page's variants through the A/B-test lifecycle, by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants.","description":"Move one of an Unbounce page's variants through the A/B-test lifecycle, by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants.\n\nChoose a `standing`: `champion` (make this variant the page's baseline), `discarded` (pull a challenger out of the test — reversible, not a delete), or `challenger` (bring a discarded variant back into the test). This is the same `standing` list_page_variants reports for each variant, so you can read a variant's current standing there and pass the target one here without translating.\n\nThe change is STAGED in the page's draft and only goes live when the page is (re)published (publish_page). Returns `{ ok: true, … }` with the staged state on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"variant","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."},{"name":"standing","type":"enum","required":true,"allowed":["champion","challenger","discarded"],"description":"champion = make this variant the baseline; discarded = pull a challenger out of the test (reversible); challenger = bring a discarded variant back into the test."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"set_variant_name","title":"Rename a variant","summary":"Rename one of an Unbounce page's variants, by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants.","description":"Rename one of an Unbounce page's variants, by `page_uuid` from list_client_pages and the variant `letter` a/b/c from list_page_variants.\n\nA variant's name is editor metadata, not page content, so the rename applies immediately — no publish_page step is needed and visitors are unaffected.\n\nReturns `{ ok: true, … }` with the new name on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"variant","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."},{"name":"name","type":"string","required":true,"allowed":null,"description":"The new display name for the variant (max 255 characters)."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Variants"],"surface":"api","experimental":false}},{"name":"delete_variant","title":"Delete a variant","summary":"Permanently delete one of an Unbounce page's variants, by `page_uuid` (from list_client_pages) and variant `letter` a/b/c (from list_page_variants).","description":"Permanently delete one of an Unbounce page's variants, by `page_uuid` (from list_client_pages) and variant `letter` a/b/c (from list_page_variants). This is the HARD removal — the variant and its history are gone and CANNOT be recovered.\n\nTo pull a challenger out of the test reversibly (keeping it), use set_variant_standing with standing `discarded` instead. The deletion is STAGED in the page's draft and only takes effect when the page is (re)published (publish_page). Returns `{ ok: true, … }` on success, or `{ ok: false, code, reason, remedy }` so you can correct the inputs and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."},{"name":"variant","type":"string","required":true,"allowed":null,"description":"The variant letter (e.g. \"a\", \"b\") from list_page_variants."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Variants"],"surface":"api","experimental":false}},{"name":"manage_page_group","title":"Create, rename, or organize a page group","summary":"Create, rename, or change the membership of a client's page groups — named folders for organizing pages.","description":"Create, rename, or change the membership of a client's page groups — named folders for organizing pages.\n\nPick an `action`: `create` (needs `client_uuid` + `name`), `rename` (needs `group_uuid` + `name`), `add_pages` or `remove_pages` (needs `group_uuid` + `page_uuids`, and `remove_pages` leaves the pages themselves untouched). Discover ids with list_accounts_and_clients, list_page_groups, and list_client_pages. Groups are pure organization — changes take effect immediately, no publish step — and a page can belong to several groups at once (add_pages is additive, not a move); to delete a group entirely, use delete_page_group.\n\n`create` is a get-or-create: the backend enforces no name uniqueness, so a same-named group already existing is returned instead of duplicated (`already_existed: true`). `add_pages`/`remove_pages` report any `skipped` page_uuids the backend couldn't resolve (not found, not accessible, or not a Classic/CCP page) without failing the rest. Group names are capped at 20 characters and can't be blank. Returns `{ ok: true, … }` on success or `{ ok: false, code, reason, remedy }`.","params":[{"name":"action","type":"enum","required":true,"allowed":["create","rename","add_pages","remove_pages"],"description":"create = new group (client_uuid + name); rename = rename a group (group_uuid + name); add_pages / remove_pages = change membership (group_uuid + page_uuids)."},{"name":"client_uuid","type":"string","required":false,"allowed":null,"description":"Required for `create`: the client UUID from list_accounts_and_clients."},{"name":"group_uuid","type":"string","required":false,"allowed":null,"description":"Required for `rename` / `add_pages` / `remove_pages`: the group_uuid from list_page_groups."},{"name":"name","type":"string","required":false,"allowed":null,"description":"Required for `create` / `rename`: the group name (max 20 characters)."},{"name":"page_uuids","type":"array\u003cstring>","required":false,"allowed":null,"description":"Required for `add_pages` / `remove_pages`: the page UUIDs (pageUuid) from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Page Groups"],"surface":"api","experimental":false}},{"name":"delete_page_group","title":"Delete a page group","summary":"Delete a client's page group (a named folder), by `group_uuid` from list_page_groups.","description":"Delete a client's page group (a named folder), by `group_uuid` from list_page_groups.\n\nOnly the group is removed — its pages are NOT deleted; they remain and still appear under \"All Pages\". Use manage_page_group with remove_pages first if you only want to take pages out of a group without deleting it. Returns `{ ok: true, group_uuid, … }` on success, or `{ ok: false, code, reason, remedy }`.","params":[{"name":"group_uuid","type":"string","required":true,"allowed":null,"description":"The group_uuid from list_page_groups."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Page Groups"],"surface":"api","experimental":false}},{"name":"reset_page_stats","title":"Reset a page's stats","summary":"Zero ALL of an Unbounce page's A/B stats — every variant at once — by `page_uuid` (from list_client_pages).","description":"Zero ALL of an Unbounce page's A/B stats — every variant at once — by `page_uuid` (from list_client_pages).\n\nThis is page-wide and IRREVERSIBLE, and it takes effect LIVE and IMMEDIATELY: there is no draft/publish step to undo it, and the visit/conversion history every variant decision rests on is gone the moment this returns. It starts a fresh measurement window. Call get_page_stats first if you want a fuller record.\n\nThe response includes `wiped`, a best-effort snapshot of the totals just before the reset (as of the last stats aggregation, so it may omit the most recent traffic) — it is the only record you will have otherwise. Returns `{ ok: true, … }` on success, or `{ ok: false, code, reason, remedy }` so you can correct and retry.","params":[{"name":"page_uuid","type":"string","required":true,"allowed":null,"description":"The pageUuid from list_client_pages."}],"returns":null,"experimental":false,"tags":{"kind":"destructive","topics":["Stats"],"surface":"api","experimental":false}},{"name":"version","title":"Server version","summary":"Return which build of the unbounce-mcp server is running: the git commit SHA (full and short) the deployed artifact was released from, and the environment (integration, production, or local).","description":"Return which build of the unbounce-mcp server is running: the git commit SHA (full and short) the deployed artifact was released from, and the environment (integration, production, or local).","params":[],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Server"],"surface":"api","experimental":false}},{"name":"recipes","title":"Recipes","summary":"List common tasks you can accomplish with Unbounce MCP, each with an example prompt to ask for it.","description":"List common tasks you can accomplish with Unbounce MCP, each with an example prompt to ask for it.\n\nTakes no input. Returns `{ recipes: [{ title, prompts }], total, presentation
