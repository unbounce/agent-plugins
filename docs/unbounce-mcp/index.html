}` — use it to discover capabilities and how to phrase a request.\n\nPresent the result to the user as a list or table of title + full prompt(s) verbatim — never summarize, paraphrase, or truncate the prompts (see the returned `presentation` directive).","params":[],"returns":null,"experimental":false,"tags":{"kind":"read","topics":["Server"],"surface":"api","experimental":false}},{"name":"submit_feedback","title":"Submit feedback","summary":"Record feedback about the Unbounce MCP tools — a bug, praise, a feature request, confusion, or other — to the team's feedback store, without copy/paste.","description":"Record feedback about the Unbounce MCP tools — a bug, praise, a feature request, confusion, or other — to the team's feedback store, without copy/paste.\n\nUse the mcp-feedback skill to drive this: it composes the record, redacts secrets, and shows you the exact content for an explicit yes before calling this tool. The server re-scrubs secrets and stamps identity, time, and build itself; only `type` and `message` travel through the conversation.\n\nReturns the stored feedback id and how many secrets were redacted.","params":[{"name":"type","type":"enum","required":true,"allowed":["bug","praise","feature_request","confusion","other"],"description":"The feedback category: 'bug' (something broke), 'praise', 'feature_request', 'confusion' (something was unclear), or 'other'."},{"name":"message","type":"string","required":true,"allowed":null,"description":"The feedback in the user's own words. Secrets are redacted before storage."},{"name":"context","type":"any","required":false,"allowed":null,"description":"Optional structured context. For a bug, the verbatim failing tool call(s) and error (tool name, exact args, raw error). Free-form JSON; strings are secret-scrubbed."}],"returns":null,"experimental":false,"tags":{"kind":"write","topics":["Server"],"surface":"api","experimental":false}}]};

const KIND_LABEL = { read: "read", write: "write", destructive: "destructive" };

// Dimensions that render a control only earn one when >1 distinct value is
// present across the tool set (the generator already pruned absent values).
const DIMS = DATA.dimensions;
const dimByKey = Object.fromEntries(DIMS.map((d) => [d.key, d]));
const toolByName = new Map(DATA.tools.map((t) => [t.name, t]));
const multiValued = (d) => d.values.length > 1;

// Active group-by spine. Default to the configured dimension if it renders a
// control, else the first groupable multi-valued dimension.
const groupables = DIMS.filter((d) => d.groupable && multiValued(d));
let groupBy =
  (dimByKey[DATA.defaultGroupBy] && multiValued(dimByKey[DATA.defaultGroupBy]))
    ? DATA.defaultGroupBy
    : (groupables[0] ? groupables[0].key : null);

// Per-dimension active filter sets (every value on by default). Only
// filterable, multi-valued dimensions get an entry.
const filterState = {};
for (const d of DIMS) {
  if (d.filterable && multiValued(d)) filterState[d.key] = new Set(d.values);
}



function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);

    if (k === "class") node.className = v;
    else if (k === "dataset") Object.assign(node.dataset, v);
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function fmtValue(v) {
  if (typeof v === "string") return JSON.stringify(v);
  return String(v);
}

/** Append text to node, rendering `backtick` spans as inline code. */
function richText(node, text) {
  String(text)
    .split(/`([^`]+)`/)
    .forEach((part, i) => {
      if (!part) return;
      node.append(i % 2 ? el("code", { class: "inline-code", text: part }) : part);
    });
  return node;
}

/** A description as one <p class=cls> per blank-line-separated paragraph. */
function descParas(text, cls) {
  return String(text)
    .split(/\n{2,}/)
    .map((para) => para.trim())
    .filter(Boolean)
    .map((para) => richText(el("p", { class: cls }), para));
}

/** The value(s) a tool carries for a dimension, always as an array. */
function toolValues(tool, dim) {
  const v = tool.tags[dim.key];
  if (Array.isArray(v)) return v;
  return v == null ? [] : [v];
}

function paramRow(p) {
  const reqCell = p.required
    ? el("span", { class: "req-badge", text: "required" })
    : el("span", { class: "opt-badge", text: "optional" });

  const meta = [];
  if (p.default !== undefined) {
    const m = el("span", { class: "pmeta" });
    m.append("default: ", el("code", { text: fmtValue(p.default) }));
    meta.push(m);
  }
  if (p.allowed && p.allowed.length) {
    const m = el("span", { class: "pmeta" });
    m.append("allowed: ");
    p.allowed.forEach((a, i) => {
      if (i) m.append(", ");
      m.append(el("code", { text: fmtValue(a) }));
    });
    meta.push(m);
  }

  const descCell = el("td", { class: "pdesc" });
  if (p.description) richText(descCell, p.description);
  meta.forEach((m) => descCell.append(m));

  return el(
    "tr",
    {},
    el("td", { class: "pname", text: p.name }),
    el("td", { class: "ptype" }, el("code", { text: p.type })),
    el("td", {}, reqCell),
    descCell
  );
}



function toolEl(tool) {
  const kind = tool.tags.kind;
  const node = el("article", { class: "tool", dataset: { kind, name: tool.name } });

  const head = el(
    "div",
    { class: "tool-head" },
    el("span", { class: "chip " + kind, text: KIND_LABEL[kind] || kind }),
    el("span", { class: "tool-name", text: tool.name }),
    el("span", { class: "tool-summary", text: tool.summary || tool.title || "" })
  );
  // Experimental badge — flags an incubating tool that may change or go away.
  if (tool.experimental) {
    head.append(el("span", { class: "chip experimental", text: "experimental" }));
  }
  // Surface tag only when the dimension renders (i.e. >1 surface in the set).
  if (dimByKey.surface && multiValued(dimByKey.surface)) {
    head.append(el("span", { class: "chip surface", text: tool.tags.surface }));
  }
  
  head.append(el("span", { class: "caret", text: "▶" }));
  head.addEventListener("click", () => node.classList.toggle("open"));

  const body = el("div", { class: "tool-body" });
  if (tool.title) body.append(el("div", { class: "tool-title", text: tool.title }));
  descParas(tool.description, "tool-desc").forEach((p) => body.append(p));

  

  if (tool.params.length) {
    body.append(el("div", { class: "params-label", text: "Parameters" }));
    const table = el("table", { class: "params" });
    table.append(
      el(
        "tr",
        {},
        el("th", { text: "Name" }),
        el("th", { text: "Type" }),
        el("th", { text: "" }),
        el("th", { text: "Description" })
      )
    );
    tool.params.forEach((p) => table.append(paramRow(p)));
    body.append(table);
  } else {
    body.append(el("p", { class: "no-params", text: "No parameters." }));
  }

  if (tool.returns) {
    body.append(el("div", { class: "params-label returns-label", text: "Returns" }));
    if (tool.returns.description) {
      descParas(tool.returns.description, "returns-desc").forEach((p) => body.append(p));
    }
    if (tool.returns.fields.length) {
      const rt = el("table", { class: "params" });
      rt.append(
        el("tr", {}, el("th", { text: "Field" }), el("th", { text: "Type" }), el("th", { text: "Description" }))
      );
      tool.returns.fields.forEach((f) => {
        const descCell = el("td", { class: "pdesc" });
        if (f.description) richText(descCell, f.description);
        if (f.allowed && f.allowed.length) {
          const m = el("span", { class: "pmeta" });
          m.append("allowed: ");
          f.allowed.forEach((a, i) => {
            if (i) m.append(", ");
            m.append(el("code", { text: fmtValue(a) }));
          });
          descCell.append(m);
        }
        rt.append(
          el("tr", {}, el("td", { class: "pname", text: f.name }), el("td", { class: "ptype" }, el("code", { text: f.type })), descCell)
        );
      });
      body.append(rt);
    }
    if (tool.returns.open) {
      body.append(
        el("p", { class: "returns-note", text: tool.returns.fields.length
          ? "Plus additional fields (passthrough of the upstream API response)."
          : "Returns an object whose fields vary (passthrough of the upstream API response)." })
      );
    }
  }

  

  node.append(head, body);
  return node;
}

// Rank a tool by kind (read → write → destructive) so within-group order is
// deterministic regardless of server registration order. Built lazily on first
// use — never at parse time — so it can't latch an empty map if dimByKey.kind
// isn't populated yet. Any unranked kind sorts last; ties keep server order
// (Array.sort is stable).
let _kindRank = null;
const kindRank = (t) => {
  if (!_kindRank) _kindRank = new Map((dimByKey.kind?.values ?? []).map((v, i) => [v, i]));
  return _kindRank.get(t.tags.kind) ?? _kindRank.size;
};
const byKind = (a, b) => kindRank(a) - kindRank(b);

/** Group the tools by the active group-by dimension, in canonical value order. */
function groupedTools() {
  const dim = dimByKey[groupBy];
  if (!dim) return [{ label: "All tools", tools: DATA.tools.slice().sort(byKind) }];
  const groups = dim.values.map((value) => ({
    label: value,
    tools: DATA.tools.filter((t) => toolValues(t, dim).includes(value)).sort(byKind),
  }));
  // Catch-all for tools carrying no value on a multi-valued spine (e.g. a tool
  // with no backing API when grouping by Backing API).
  const orphans = DATA.tools.filter((t) => toolValues(t, dim).length === 0).sort(byKind);
  if (orphans.length) groups.push({ label: "None", tools: orphans });
  return groups.filter((g) => g.tools.length);
}

function renderGroupBySelect() {
  const sel = document.getElementById("groupBy");
  sel.innerHTML = "";
  for (const d of groupables) {
    sel.append(el("option", { value: d.key, text: d.label }));
  }
  sel.value = groupBy || "";
  // Hide the whole control if there's nothing meaningful to group by.
  sel.closest(".group-by").classList.toggle("hidden", groupables.length <= 1);
}

function renderFilters() {
  const root = document.getElementById("filters");
  root.innerHTML = "";
  for (const d of DIMS) {
    // A dimension is a filter only when filterable, multi-valued, and NOT the
    // current grouping spine (the spine is expressed as sections instead).
    if (!d.filterable || !multiValued(d) || d.key === groupBy) continue;
    const active = filterState[d.key];
    const row = el("div", { class: "filter-dim", dataset: { dim: d.key } });
    row.append(el("span", { class: "dim-label", text: d.label }));
    const chips = el("div", { class: "chips" });
    for (const value of d.values) {
      const chip = el("button", {
        class: "filter-chip" + (active.has(value) ? " active" : ""),
        dataset: { dim: d.key, value },
        text: value,
      });
      chips.append(chip);
    }
    row.append(chips);
    root.append(row);
  }
}

function render() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  

  for (const group of groupedTools()) {
    const groupEl = el("div", { class: "group" });
    const h3 = el("h3", {});
    h3.append(group.label + " ", el("span", { class: "grp-count", text: "(" + group.tools.length + ")" }));
    groupEl.append(h3);
    group.tools.forEach((t) => groupEl.append(toolEl(t)));
    content.append(groupEl);
  }

  

  renderFilters();
  applyFilter();
}

function applyFilter() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  let anyVisible = false;

  document.querySelectorAll(".group").forEach((groupEl) => {
    let groupVisible = false;
    groupEl.querySelectorAll(".tool").forEach((toolNode) => {
      const tool = toolByName.get(toolNode.dataset.name);
      // A tool passes a dimension's filter when it carries at least one active
      // value for that dimension (the grouping spine has no filter entry).
      let tagsOk = true;
      for (const [key, active] of Object.entries(filterState)) {
        if (key === groupBy) continue;
        const vals = toolValues(tool, dimByKey[key]);
        // Empty-valued tools (no backing API, say) pass — a filter narrows by
        // presence of an active value, it never hides the unclassified.
        if (vals.length && !vals.some((v) => active.has(v))) { tagsOk = false; break; }
      }
      const textOk = !q || toolNode.textContent.toLowerCase().includes(q);
      const show = tagsOk && textOk;
      toolNode.classList.toggle("hidden", !show);
      if (show) { groupVisible = true; anyVisible = true; }
    });
    groupEl.classList.toggle("hidden", !groupVisible);
  });

  document.getElementById("noResults").style.display = anyVisible ? "none" : "block";
}

document.getElementById("search").addEventListener("input", applyFilter);
document.getElementById("groupBy").addEventListener("change", (e) => {
  groupBy = e.target.value;
  render();
});
document.getElementById("filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".filter-chip");
  if (!chip) return;
  const { dim, value } = chip.dataset;
  const active = filterState[dim];
  if (active.has(value)) active.delete(value);
  else active.add(value);
  chip.classList.toggle("active");
  applyFilter();
});
document.getElementById("expandAll").addEventListener("click", () =>
  document.querySelectorAll(".tool:not(.hidden)").forEach((t) => t.classList.add("open"))
);
document.getElementById("collapseAll").addEventListener("click", () =>
  document.querySelectorAll(".tool").forEach((t) => t.classList.remove("open"))
);

document.getElementById("footer").textContent =
  DATA.toolCount + " tools · generated " + new Date(DATA.generatedAt).toLocaleString();

renderGroupBySelect();
render();
</script>
</body>
</html>
